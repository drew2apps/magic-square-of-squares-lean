          # run 3's Fisher descents (rank_fisher*, rank_second), which Theta_4 builds on (about 2.5 minutes)
          for s in rank_fisher rank_fisher5 rank_second; do
            python3 $s.py 2>/dev/null | grep -v 'PARI stack' | diff - $s.txt
            python3 $s.py --negative 2>/dev/null | grep -v 'PARI stack' | diff - ${s}_negative.txt
