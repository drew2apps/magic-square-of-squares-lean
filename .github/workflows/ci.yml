name: CI

# Two levels.  Every push to main runs `build` (Lean, the axiom audit, the generated files, the C searches) and `quick`
# (the checkers that read committed transcripts and a few small reruns): about 20 minutes, most of it Lean. `rank` (the sub-project
# lean_rank/ on Lean v4.36.0 with Stoll's EllipticCurves) also runs on every push, about 15 minutes.
# The long jobs (`four-points`, `descents`, `research`, `last-pair`, `twist-search`, `scan-5000`, `scan-15000`; they run in parallel, the longest, `descents`, about 2 hours) regenerate the main computed records
# and stated samples of the others.  They do not regenerate everything: OUTPUTS.md lists the committed
# outputs that no job reruns (the wide runs, the scan beyond 1100, the Magma transcripts and others).
# They run on a pull request, on a tag, when the workflow is started by hand (Actions, CI, "Run workflow"), and on a push
# whose commit message contains [full ci].  A green mark on a push without [full ci] therefore says less than a green
# mark on a full run: the long jobs show as skipped.  A release is made only from a commit with a full green run.
# The three actions are pinned by commit hash (the tag is in the comment: lean-action as of 24 November 2026; checkout and
# setup-python moved on 26 November 2026 from v4 and v5, which run on the deprecated Node 20, to v5.1.0 and v6.3.0, which
# run on Node 24); Python packages by version.  REPRODUCE.md lists every pin and what is not pinned.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Generated Lean files match their generators
        shell: bash
        run: |
          set -e
          python3 -m py_compile scripts/g1_full/*.py scripts/search/*.py scripts/gauss_descent/*.py scripts/second_descent/*.py scripts/hill/*.py
          python3 -m py_compile experiments/census2000/*.py experiments/census-wide/*.py experiments/census-wide/*/*.py experiments/open-ratio/*.py experiments/open-ratio/four/*.py
          python3 scripts/g1_full/check_evidence.py
          python3 scripts/g1_full/check_evidence.py --negative > /tmp/negative.out
          grep -q '^negative tests: 520 altered records, all rejected' /tmp/negative.out
          test "$(cat MagicSquareOfSquares/*.lean | grep -c '^theorem \|^private theorem ')" = "$(cat scripts/declared_theorems.txt)"
          python3 scripts/g1_full/octic_check.py > /tmp/octic.out
          diff /tmp/octic.out <(tail -n +2 scripts/g1_full/octic_check.txt)
          python3 scripts/g1_full/height_sides.py > /tmp/height_sides.out
          diff /tmp/height_sides.out scripts/g1_full/height_sides.txt
          grep -q "$(sha256sum scripts/search/seven.c | cut -d' ' -f1)" scripts/search/seven_search.txt
          gcc -O2 -Wall -Wextra -Werror -o /tmp/seven scripts/search/seven.c -lm
          gcc -O2 -Wall -Wextra -Werror -o /tmp/seven_brute scripts/search/seven_brute.c
          /tmp/seven 1 100000 | tee /tmp/seven.out
          grep -q "7 squares=235 8 squares=0 9 squares=0; multiples of Bremner's square=235 other=0" /tmp/seven.out
          test "$(/tmp/seven_brute 430 | sort -u)" = "425 138600 41496 7"
          gcc -O2 -Wall -Wextra -Werror -o /tmp/ratio_pairs scripts/search/ratio_pairs.c -lm
          for H in 100 400; do grep -qxF "$(/tmp/ratio_pairs $H scripts/g1_full/modp_classes.txt)" scripts/search/ratio_pairs.txt; done
          grep -qxF "$(python3 scripts/search/ratio_pairs_brute.py 50 scripts/g1_full/modp_classes.txt)" scripts/search/ratio_pairs.txt
          gcc -O2 -Wall -Wextra -Werror -o /tmp/twist_find scripts/search/twist_find.c -lm
          test -z "$(/tmp/twist_find 80 80)"
          python3 scripts/g1_full/gen_lean.py
          python3 scripts/g1_full/gen_census1000.py
          python3 scripts/g1_full/gen_sizecheck.py
          python3 scripts/cover_descent/lean_cert.py
          git diff --exit-code
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
      - name: Axiom audit
        shell: bash
        run: |
          set -o pipefail
          lake env lean scripts/Audit.lean | tee audit.txt
          grep '^AUDIT OK:' audit.txt >> "$GITHUB_STEP_SUMMARY"
          diff <(grep '^AUDIT OK:' audit.txt) scripts/audit_line.txt
          diff <(sort audit.txt) <(sort scripts/audit_output.txt)
          echo "::notice title=Axiom audit::$(grep '^AUDIT OK:' audit.txt)"
          lake env lean scripts/AuditInternal.lean > internal.txt
          diff <(sort internal.txt) <(sort scripts/audit_internal.txt)
      - name: The count 306 + 119 = 425, and forged certificates are refused
        shell: bash
        run: |
          set -e -o pipefail
          lake env lean scripts/CoverDescentChecks.lean
          lake env lean scripts/TwoDescentChecks.lean

  rank:
    # lean_rank/: rank E(Q) >= 2 on the 254 twice-square curves m <= 1000 (UNIFORM_RANK.md, section 7), a sub-project on
    # Lean v4.36.0 and Mathlib v4.36.0 with Michael Stoll's EllipticCurves 2164fb5 (Mordell-Weil; compiled here, Mathlib from its cache); it
    # compiles five modules of the main tree unchanged (srcDir = ".."; `Defs`, the definitions, added in run 5). The main
    # library stays on v4.33.1.
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          lake-package-directory: lean_rank
      - name: Axioms of every headline theorem (the print-axioms lines replayed by lake build), the checks, forged claims refused
        shell: bash
        working-directory: lean_rank
        run: |
          set -e -o pipefail
          lake --version > lakever.txt
          grep -q 'Lean version 4.36.0' lakever.txt
          lake build > build.txt 2>&1 || { cat build.txt; exit 1; }
          # every `#print axioms` line of LeanRank/*.lean (file and line) is answered in the output of lake build, with the
          # standard axioms only; no sorry
          python3 - <<'PY'
          import glob, re, sys
          ok = {'propext', 'Classical.choice', 'Quot.sound'}
          build = open('build.txt').read()
          src = {(f, i + 1) for f in glob.glob('LeanRank/*.lean')
                 for i, l in enumerate(open(f).read().split('\n')) if l.startswith('#print axioms ')}
          # a long name makes Lean wrap the axiom list over several lines
          pat = re.compile(r"^info: (\S+?):(\d+):\d+: '.*?' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)", re.M)
          got, bad = set(), []
          for m in pat.finditer(build):
              got.add((m.group(1), int(m.group(2))))
              if m.group(3) is not None and not {a.strip() for a in m.group(3).split(',')} <= ok:
                  bad.append(m.group(0))
          print(len(src), 'print-axioms lines in the sources;', len(got), 'answered by lake build;', len(bad), 'with a non-standard axiom')
          sys.exit(1 if bad or got != src or 'sorryAx' in build or "declaration uses 'sorry'" in build or 'declaration uses `sorry`' in build else 0)
          PY
          lake env lean scripts/RankChecks.lean
          lake env lean scripts/RankZeroForge.lean
          lake env lean scripts/RankZeroCensusForge.lean
          lake env lean scripts/E1RankChecks.lean
          lake env lean scripts/CensusClosureChecks.lean
          lake env lean scripts/CensusClosureAxioms.lean
          # each forged claim fails, at its own line, and nothing else fails
          for spec in 'RankForge:19 23 27 33' 'FamilyForge:20 24 29 34 42 46 64 71' 'LemmaDForge:25 31 52 57 64' 'LemmaDBridgeForge:25 28' \
              'E1DescentForge:20 25 30 30 35' 'TorsionE1Forge:26 32 35 40 46 50 54' \
              'CensusClosureForge:27 30 35 39 42 45 58 64 72 76 83 91 100' 'CensusClosureAxiomsForge:15' \
              'TwoDescentCertForge:35 43 47 51 55 65 69 73 77 81 85 89 97 102' 'UniformRankAllForge:26 30 34 38 41 45 56 60 64'; do
            f=${spec%%:*}; want=${spec#*:}
            if lake env lean scripts/$f.lean > $f.txt 2>&1; then echo "forged claims accepted in $f"; exit 1; fi
            got=$(sed -n "s/^scripts\/$f.lean:\([0-9]*\):[0-9]*: error.*/\1/p" $f.txt | tr '\n' ' ')
            test "$got" = "$want "
          done

  quick:
    # On every push: what can be checked in a few minutes.  The transcripts of Magma against the committed outputs, the
    # counts, and a small rerun of each program, compared with the first lines of the committed files.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: every file has the hash listed in MANIFEST.sha256, and no file is unlisted
        shell: bash
        run: python3 scripts/verify_manifest.py
      - name: transcript checkers, counts, and a small rerun of each descent program
        shell: bash
        run: |
          set -e -o pipefail
          pip install -q -r scripts/g1_full/requirements.txt
          pip install -q sympy==1.14.0
          # run 10 (tier D): the exchange symmetry at the nine open ratios (exact, a second)
          python3 -I experiments/exchange/open_pairs.py | diff - experiments/exchange/open_pairs.txt
          python3 scripts/g1_full/check_sigma.py | diff - scripts/g1_full/check_sigma.txt
          python3 scripts/g1_full/sigma_exact.py | diff - scripts/g1_full/sigma_exact.txt
          (cd scripts/second_descent && python3 second_exact.py | diff - second_exact.txt)
          python3 scripts/degenerate_squares.py 1000 | diff - scripts/degenerate_squares.txt
          python3 scripts/g1_full/sigma_generic.py | diff - scripts/g1_full/sigma_generic.txt
          python3 scripts/g1_full/two_descent_certs.py | diff - scripts/g1_full/two_descent_certs.txt
          # SELMER_SQUARE.md: the forged inputs, and the rule of Proposition S2 against the committed exact descent (about a minute)
          python3 scripts/g1_full/selmer_square.py --negative | diff - scripts/g1_full/selmer_square_negative.txt
          # SELMER_SQUARE.md, OUTPUTS.md: the exact descent rerun for m <= 300 (108 curves), against the first rows of the
          # committed table and JSON (m <= 5000 takes 26 minutes), and the rank-2 check of the recorded points (about 30 s)
          T=$(mktemp -d)
          python3 scripts/g1_full/selmer_square.py --max 300 --dump-tsv > "$T/ss300.tsv"
          diff "$T/ss300.tsv" <(head -n 109 scripts/g1_full/selmer_square_5000.tsv)
          python3 scripts/g1_full/selmer_square.py --max 300 --dump-json > "$T/ss300.json"
          python3 -c "import json, sys; a = json.load(open(sys.argv[1])); b = json.load(open(sys.argv[2])); sys.exit(0 if len(a) == 108 and a == b[:108] else 1)" "$T/ss300.json" scripts/g1_full/selmer_square_5000.json
          python3 scripts/g1_full/selmer_square_rank2.py | diff - scripts/g1_full/selmer_square_rank2.txt
          python3 scripts/g1_full/selmer_square_rank2.py --negative > "$T/r2neg.txt"
          test "$(tail -n 1 "$T/r2neg.txt")" = 'negative tests: 2 of 2 refused'
          # SQUARE_SECTION.md: the review's independent second descent for the class 2 on all 108 curves, against the
          # committed table, and its forged inputs (about 45 s)
          python3 scripts/g1_full/review_t8_rank1.py --class2 300 | diff - scripts/g1_full/review_t8_class2.txt
          python3 scripts/g1_full/review_t8_rank1.py --negative | diff - scripts/g1_full/review_t8_negative.txt
          # SELMER_SQUARE.md: Theorem S1 is not Klagsbrun's obstruction (the part without PARI); SQUARE_SECTION.md: forged inputs
          python3 scripts/g1_full/klagsbrun_check.py | diff - <(head -n 18 scripts/g1_full/klagsbrun_check.txt; tail -n 1 scripts/g1_full/klagsbrun_check.txt)
          python3 scripts/g1_full/square_section.py --negative | diff - scripts/g1_full/square_section_negative.txt
          (cd scripts/second_descent && python3 review_t5_labels.py | diff - review_t5_labels.txt)
          (cd scripts/g1_full && python3 lemmaD_reduction_check.py | diff - lemmaD_reduction_check.txt)
          python3 lean_rank/scripts/rank_zero_check.py > rzc.txt
          test "$(tail -n 1 rzc.txt)" = 'ALL CHECKS PASSED'
          python3 -I lean_rank/scripts/gen_rank_zero_certs.py rz.lean 4,3 7,1 12,5 24,7 > rzgen.txt
          diff rz.lean lean_rank/LeanRank/RankZeroCensus.lean
          if python3 -I lean_rank/scripts/gen_rank_zero_certs.py rzbad.lean 15,8 > rzbad.txt 2>&1; then echo 'generator accepted (15, 8)'; exit 1; fi
          rm -f rzc.txt rz.lean rzgen.txt rzbad.lean rzbad.txt
          # run 4: the exact cross-checks of E1(Q(sqrt2)) (rank 0 classes, torsion) and of the census closures in Lean
          python3 scripts/g1_full/e1_rank0_check.py | diff - scripts/g1_full/e1_rank0_check.txt
          python3 scripts/g1_full/torsion_e1_check.py | diff - scripts/g1_full/torsion_e1_check.txt
          python3 -I lean_rank/scripts/gen_census_closure.py cc.lean 4,3 7,1 12,5 24,7 > ccgen.txt
          cmp cc.lean lean_rank/LeanRank/CensusClosure.lean
          python3 -I lean_rank/scripts/census_closure_check.py lean_rank/LeanRank/CensusClosure.lean MagicSquareOfSquares/G1Census1000.lean > ccc.txt
          test "$(tail -n 1 ccc.txt)" = 'ALL OK: 4 pairs, 2 partner ratios'
          grep -qx 'negative test: 20 of 20 mutated inputs refused' ccc.txt
          rm -f cc.lean ccgen.txt ccc.txt
          python3 scripts/g1_full/selmer_square_rule.py --max 5000 --tsv-to "$T/rule.tsv" | diff - scripts/g1_full/selmer_square_rule_5000.txt
          diff "$T/rule.tsv" scripts/g1_full/selmer_square_rule_5000.tsv
          rm -rf "$T"
          (cd scripts/second_descent && python3 exact_last_pair.py | diff - exact_last_pair.txt && python3 exact_last_pair.py --negative | diff - exact_last_pair_negative.txt)
          (cd scripts/g1_full && python3 rank_indep.py | diff - rank_indep.txt && python3 rank_indep.py --negative | diff - rank_indep_negative.txt && python3 rank_indep.py --all | diff - rank_indep_all.txt)
          (cd scripts/g1_full && python3 rank_indep_heights.py | diff - rank_indep_heights.txt && python3 rank_indep_heights.py --negative | diff - rank_indep_heights_negative.txt)
          # OUTPUTS.md: committed outputs that were not regenerated anywhere, the fast ones (Sage from requirements.txt, no eclib)
          (cd scripts/g1_full && python3 height_precision.py | diff - height_precision.txt)
          (cd scripts/g1_full/genus2 && python3 frobenius.py | diff - <(tail -n +2 frobenius.txt))
          python3 scripts/g1_full/sigma_exact.py --negative > /tmp/sigma_exact_neg.txt
          grep -q 'negative tests: 96 altered records, 96 refused' /tmp/sigma_exact_neg.txt
          cd scripts/gauss_descent
          python3 gauss_descent.py 820,799 889,320 4,3 72,65 | sed 's/  \[[0-9.]* s\]$//' | diff - ci_expected.txt
          python3 twocover_check.py | diff - twocover_check.txt
          python3 twocover_check.py --bounded | diff - twocover_bounded.txt
          python3 subsets.py 4,3 15,8 | diff - <(head -n 2 subsets.txt)
          cd ../second_descent
          python3 magma_check.py | diff - magma_check.txt
          python3 tally.py second_123.jsonl lvalue_open.jsonl | diff - tally.txt
          python3 second_descent.py --summary second_123.jsonl | diff - second_summary.txt
          python3 wide.py --summary wide_1000_2000.jsonl | diff - wide_summary.txt
          python3 wide.py --summary wide_2000_2500.jsonl | diff - wide_2000_2500_summary.txt
          python3 wide.py --summary wide_2500_3000.jsonl | diff - wide_2500_3000_summary.txt
          python3 indep_rank.py --ainvs 0,-491040,0,-13400146081,0 440,279 | grep -v "PARI stack" | diff - indep_rank_440_279.txt
          python3 lproof.py curve 0,-491040,0,-13400146081,0 '(440,279), curve y^2 = x(x - 719^2)(x + 161^2), the twist by -1 of the Frey curve:' | grep -v "PARI stack" | diff - lproof_440_279.txt
          python3 second_descent.py --all 15,8 21,20 23,7 | diff - <(head -n 3 second_123.jsonl)
          # whole output to a file first: head on a live pipe can end it early (SIGPIPE under pipefail)
          lp=$(mktemp); python3 lproof.py 1e7 second_123.jsonl > "$lp"; grep -v "PARI stack" "$lp" | head -n 5 | diff - <(head -n 5 lproof.txt)
          test "$(tail -n 1 "$lp")" = "closing curves of conductor up to 1e+07: 5 of 89; L(E,1) > 0 with the error bound for all of them: True"
          # LAST_PAIR.md, the fast parts (the two sieves are in the job last-pair of the full run)
          python3 lemma2_general.py | grep -v "PARI stack" | diff - lemma2_general.txt
          python3 degenerate_section.py /tmp/degenerate_section_polys.txt | grep -v "PARI stack" | diff - degenerate_section.txt
          diff /tmp/degenerate_section_polys.txt degenerate_section_polys.txt
          python3 wide_open.py | diff - route_wide_summary.txt
          # LAST_PAIR.md, section 11: the class d from a short descent on the double cover (Python and sympy only)
          cd ../cover_descent
          python3 cover_descent.py 627,364 | diff - cover_627_364.txt
          # the input of the exhaustion sample of COMPLETE.md, section 7, test 7 (b) is every 40th line of the list (OUTPUTS.md)
          diff <(awk 'NR % 40 == 1' structure/class_selmer_15000_list.txt | cut -d' ' -f1) <(tail -n +2 tuple_bruteforce_15000_sample_in.txt)
          grep -q "^left: \[521266\] (exactly the classes of the known points)$" cover_627_364.txt
          python3 cover_descent.py 820,799 | diff - cover_820_799.txt
          python3 cover_descent.py 889,320 | diff - cover_889_320.txt
          test "$(cat cover_820_799.txt cover_889_320.txt | grep -c "^left: \[\] (no class is possible")" = 2
          python3 cover_descent.py 627,364 selftest | diff - cover_selftest_627_364.txt
          python3 cover_summary.py cover_34.txt cover_123.txt | diff - cover_summary.txt
          # the same local eliminations by exhaustion over all points modulo p^N (no code shared with cover_descent.py), prime by prime
          python3 cover_certificate.py 627,364 | diff - cover_certificate_627_364.txt
          grep -q "^left by the descent: \[521266\]; left by the exhaustion: \[521266\];" cover_certificate_627_364.txt
          # the two methods end with the same set, but not with the same set at every prime: 17 of 18 for (627,364) and (820,799), 18 of 18 for (889,320)
          test "$(grep -c "the same set$" cover_certificate_627_364.txt)" = 17
          test "$(grep -c "the same set$" cover_certificate_820_799.txt)" = 17
          test "$(grep -c "the same set$" cover_certificate_889_320.txt)" = 18
          # section 12: one class for each form; all lists, under a second per ratio
          python3 tuple_descent.py magic 627,364 | diff - tuple_627_364.txt
          (for r in 627,364 820,799 15,8 247,96; do python3 tuple_descent.py magic $r selftest; done) | diff - tuple_selftest.txt
          test "$(grep -c "outside the allowed set: 0$" tuple_selftest.txt)" = 4
          # tests of the local class rules (LAST_PAIR.md, section 14): points near the zeros of the forms; a second implementation with lists of squares; two wrong rules that it has to catch
          (for r in 627,364 820,799 440,279 4,3; do python3 tuple_descent.py magic $r neartest; python3 tuple_descent.py magic $r oracle; done) | diff - tuple_neartest.txt
          test "$(grep -c "outside the allowed set: 0$\|disagreements: 0$" tuple_neartest.txt)" = 8
          python3 tuple_mutation.py | diff - tuple_mutation.txt
          # the same test near the zeros of the forms on twelve more ratios and four bases of the cuboid system (the rule R4 of section 14)
          (for r in 15,8 247,96 440,99 991,263 889,320 724,665 1073,264 4664,873 4828,3885 2365,588 308,185 493,123; do python3 tuple_descent.py magic $r neartest; done; for r in 15,8 17,16 19,16 26,23; do python3 tuple_descent.py cuboid $r neartest; done) | diff - tuple_neartest_more.txt
          test "$(grep -c "outside the allowed set: 0$" tuple_neartest_more.txt)" = 16
          python3 tuple_bruteforce.py magic 627,364 | diff - tuple_bruteforce_627_364.txt
          grep -q "^kept at every prime: 2: \[(1, 2, 263, 991), (1, 2, 1982, 526)\]$" tuple_bruteforce_627_364.txt
          python3 tuple_descent.py batch magic ../gauss_descent/pairs34.txt 2 | diff - tuple_34.txt
          python3 tuple_descent.py batch magic ../second_descent/pairs123.txt 2 | diff - tuple_123.txt
          python3 tuple_descent.py batch magic ../gauss_descent/pairs_notrivial_1000.txt 2 | diff - tuple_681.txt
          python3 tuple_descent.py batch magic pairs_route_wide.txt 2 | diff - tuple_route_wide.txt
          test "$(cat tuple_34.txt tuple_681.txt | grep -c "nothing is left$")" = 715
          test "$(cat tuple_123.txt tuple_route_wide.txt | grep -c "exactly the known points$")" = 138
          # every ratio with m <= 5000 that avoids the 484 classes: the first lines are rerun, the counts are checked on the whole files
          python3 tuple_descent.py batch magic ../gauss_descent/scan_certificates.txt 2 0 300 | diff - <(head -n 300 tuple_scan_5000.txt)
          python3 tuple_descent.py batch magic pairs_trivial_5000.txt 2 0 60 | diff - <(head -n 60 tuple_trivial_5000.txt)
          test "$(wc -l < tuple_scan_5000.txt)" = 18900
          test "$(grep -c "nothing is left$" tuple_scan_5000.txt)" = 18900
          test "$(wc -l < tuple_trivial_5000.txt)" = 1523
          test "$(grep -c "exactly the known points$" tuple_trivial_5000.txt)" = 1523
          diff <(cut -d: -f1 tuple_scan_5000.txt | tr -d '()') <(cut -d' ' -f1 ../gauss_descent/scan_certificates.txt)
          # RATIONAL_DISTANCE.md: the lines with denominator up to 40, the curve, the control with three distances; counts of the whole files
          cd ../rational_distance
          # whole output to a file first (head on a live pipe can end it early under pipefail); the summary line is checked too
          rdo=$(mktemp); python3 rd.py scan 2 40 > "$rdo"; head -n 244 "$rdo" | diff - <(head -n 244 rd_scan_2_300.txt)
          test "$(wc -l < "$rdo")" = 245
          test "$(tail -n 1 "$rdo")" = "lines y = r/s with 2 <= s <= 40, 0 < r/s < 1/2: 244; tuples left (number: lines): [(1, 1), (2, 183), (4, 60)]; lines with a tuple whose four classes are not all equal: 0 []"
          test "$(grep -c " equal$" rd_scan_2_300.txt)" = 13697
          test "$(grep -c "MIXED" rd_scan_2_300.txt)" = 1
          grep -q "^26/225 12 MIXED" rd_scan_2_300.txt
          test "$(grep -c " equal$" rd_scan_outside_60.txt)" = 2204
          python3 rd.py curve | diff - rd_curve.txt
          test "$(grep -c "equal: True$" rd_curve.txt)" = 22
          python3 rd.py control | diff - rd_control.txt
          python3 rd_prop1.py | diff - rd_prop1.txt
          grep -qx 'PROP1 OK' rd_prop1.txt
          python3 si_criterion_test.py 4 2>/dev/null | tail -2 > /tmp/si.txt
          grep -q 'with all hypotheses (would contradict the criterion): 0$' /tmp/si.txt
          grep -q 'with all hypotheses (would contradict the criterion): 0$' si_criterion_test.txt
          grep -q 'lower bound 1 and upper bound 1 for the rank$' /tmp/si.txt
          grep -q 'lower bound 1 and upper bound 1 for the rank$' si_criterion_test.txt
          test "$(grep -c 'the descent set is inside the exhaustion set: True' rd_exhaust.txt)" = 6
          pip install -q numpy==2.5.5
          # SECOND_DESCENT.md, section 6: the L-value of the curve of (440,279), (719,161) with conductor, root number and a_n computed exactly
