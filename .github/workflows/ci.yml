name: CI

# Two levels.  Every push to main runs `build` (Lean, the axiom audit, the generated files, the C searches) and `quick`
# (the checkers that read committed transcripts and a few small reruns): about 20 minutes, most of it Lean.
# The long jobs (`four-points`, `descents`, `last-pair`, `twist-search`, `scan-5000`, `scan-15000`; they run in parallel, the longest about 95 minutes) regenerate the main computed records
# and stated samples of the others.  They do not regenerate everything: SECOND_DESCENT.md, section 8, lists the committed
# outputs that no job reruns (the wide runs, the scan beyond 1100, the 681-ratio real-point run and others).
# They run on a pull request, on a tag, when the workflow is started by hand (Actions, CI, "Run workflow"), and on a push
# whose commit message contains [full ci].  A green mark on a push without [full ci] therefore says less than a green
# mark on a full run: the long jobs show as skipped.  A release is made only from a commit with a full green run.
# The three actions are pinned by commit hash (the tag they had on 24 November 2026 is in the comment); Python packages by
# version.  REPRODUCE.md lists every pin and what is not pinned.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generated Lean files match their generators
        shell: bash
        run: |
          set -e
          python3 -m py_compile scripts/g1_full/*.py scripts/search/*.py scripts/gauss_descent/*.py scripts/second_descent/*.py scripts/hill/*.py
          python3 scripts/g1_full/check_evidence.py
          python3 scripts/g1_full/check_evidence.py --negative > /tmp/negative.out
          grep -q '^negative tests: 520 altered records, all rejected' /tmp/negative.out
          test "$(cat MagicSquareOfSquares/*.lean | grep -c '^theorem \|^private theorem ')" = "$(cat scripts/declared_theorems.txt)"
          python3 scripts/g1_full/octic_check.py > /tmp/octic.out
          diff /tmp/octic.out <(tail -n +2 scripts/g1_full/octic_check.txt)
          python3 scripts/g1_full/height_sides.py > /tmp/height_sides.out
          diff /tmp/height_sides.out scripts/g1_full/height_sides.txt
          grep -q "$(sha256sum scripts/search/seven.c | cut -d' ' -f1)" scripts/search/seven_search.txt
          gcc -O2 -Wall -Wextra -Werror -o /tmp/seven scripts/search/seven.c -lm
          gcc -O2 -Wall -Wextra -Werror -o /tmp/seven_brute scripts/search/seven_brute.c
          /tmp/seven 1 100000 | tee /tmp/seven.out
          grep -q "7 squares=235 8 squares=0 9 squares=0; multiples of Bremner's square=235 other=0" /tmp/seven.out
          test "$(/tmp/seven_brute 430 | sort -u)" = "425 138600 41496 7"
          gcc -O2 -Wall -Wextra -Werror -o /tmp/ratio_pairs scripts/search/ratio_pairs.c -lm
          for H in 100 400; do grep -qxF "$(/tmp/ratio_pairs $H scripts/g1_full/modp_classes.txt)" scripts/search/ratio_pairs.txt; done
          grep -qxF "$(python3 scripts/search/ratio_pairs_brute.py 50 scripts/g1_full/modp_classes.txt)" scripts/search/ratio_pairs.txt
          gcc -O2 -Wall -Wextra -Werror -o /tmp/twist_find scripts/search/twist_find.c -lm
          test -z "$(/tmp/twist_find 80 80)"
          python3 scripts/g1_full/gen_lean.py
          python3 scripts/g1_full/gen_census1000.py
          python3 scripts/g1_full/gen_sizecheck.py
          python3 scripts/cover_descent/lean_cert.py
          git diff --exit-code
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
      - name: Axiom audit
        shell: bash
        run: |
          set -o pipefail
          lake env lean scripts/Audit.lean | tee audit.txt
          grep '^AUDIT OK:' audit.txt >> "$GITHUB_STEP_SUMMARY"
          diff <(grep '^AUDIT OK:' audit.txt) scripts/audit_line.txt
          diff <(sort audit.txt) <(sort scripts/audit_output.txt)
          echo "::notice title=Axiom audit::$(grep '^AUDIT OK:' audit.txt)"
          lake env lean scripts/AuditInternal.lean > internal.txt
          diff <(sort internal.txt) <(sort scripts/audit_internal.txt)
      - name: The count 306 + 119 = 425, and forged certificates are refused
        shell: bash
        run: |
          set -e -o pipefail
          lake env lean scripts/CoverDescentChecks.lean

  quick:
    # On every push: what can be checked in a few minutes.  The transcripts of Magma against the committed outputs, the
    # counts, and a small rerun of each program, compared with the first lines of the committed files.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: every file has the hash listed in MANIFEST.sha256, and no file is unlisted
        shell: bash
        run: python3 scripts/verify_manifest.py
      - name: transcript checkers, counts, and a small rerun of each descent program
        shell: bash
        run: |
          set -e -o pipefail
          pip install -q -r scripts/g1_full/requirements.txt
          pip install -q sympy==1.14.0
          python3 scripts/g1_full/check_sigma.py | diff - scripts/g1_full/check_sigma.txt
          python3 scripts/g1_full/sigma_exact.py | diff - scripts/g1_full/sigma_exact.txt
          (cd scripts/second_descent && python3 second_exact.py | diff - second_exact.txt)
          python3 scripts/degenerate_squares.py 1000 | diff - scripts/degenerate_squares.txt
          python3 scripts/g1_full/sigma_generic.py | diff - scripts/g1_full/sigma_generic.txt
          (cd scripts/second_descent && python3 exact_last_pair.py | diff - exact_last_pair.txt && python3 exact_last_pair.py --negative | diff - exact_last_pair_negative.txt)
          (cd scripts/g1_full && python3 rank_indep.py | diff - rank_indep.txt && python3 rank_indep.py --negative | diff - rank_indep_negative.txt)
          (cd scripts/g1_full && python3 rank_indep_heights.py | diff - rank_indep_heights.txt && python3 rank_indep_heights.py --negative | diff - rank_indep_heights_negative.txt)
          python3 scripts/g1_full/sigma_exact.py --negative | grep -q 'negative tests: 96 altered records, 96 refused'
          cd scripts/gauss_descent
          python3 gauss_descent.py 820,799 889,320 4,3 72,65 | sed 's/  \[[0-9.]* s\]$//' | diff - ci_expected.txt
          python3 twocover_check.py | diff - twocover_check.txt
          python3 twocover_check.py --bounded | diff - twocover_bounded.txt
          python3 subsets.py 4,3 15,8 | diff - <(head -n 2 subsets.txt)
          cd ../second_descent
          python3 magma_check.py | diff - magma_check.txt
          python3 tally.py second_123.jsonl lvalue_open.jsonl | diff - tally.txt
          python3 second_descent.py --summary second_123.jsonl | diff - second_summary.txt
          python3 wide.py --summary wide_1000_2000.jsonl | diff - wide_summary.txt
          python3 second_descent.py --all 15,8 21,20 23,7 | diff - <(head -n 3 second_123.jsonl)
          # whole output to a file first: head on a live pipe can end it early (SIGPIPE under pipefail)
          lp=$(mktemp); python3 lproof.py 1e7 second_123.jsonl > "$lp"; grep -v "PARI stack" "$lp" | head -n 5 | diff - <(head -n 5 lproof.txt)
          test "$(tail -n 1 "$lp")" = "closing curves of conductor up to 1e+07: 5 of 89; L(E,1) > 0 with the error bound for all of them: True"
          # LAST_PAIR.md, the fast parts (the two sieves are in the job last-pair of the full run)
          python3 lemma2_general.py | grep -v "PARI stack" | diff - lemma2_general.txt
          python3 degenerate_section.py /tmp/degenerate_section_polys.txt | grep -v "PARI stack" | diff - degenerate_section.txt
          diff /tmp/degenerate_section_polys.txt degenerate_section_polys.txt
          python3 wide_open.py | diff - route_wide_summary.txt
          # LAST_PAIR.md, section 11: the class d from a short descent on the double cover (Python and sympy only)
          cd ../cover_descent
          python3 cover_descent.py 627,364 | diff - cover_627_364.txt
          grep -q "^left: \[521266\] (exactly the classes of the known points)$" cover_627_364.txt
          python3 cover_descent.py 820,799 | diff - cover_820_799.txt
          python3 cover_descent.py 889,320 | diff - cover_889_320.txt
          test "$(cat cover_820_799.txt cover_889_320.txt | grep -c "^left: \[\] (no class is possible")" = 2
          python3 cover_descent.py 627,364 selftest | diff - cover_selftest_627_364.txt
          python3 cover_summary.py cover_34.txt cover_123.txt | diff - cover_summary.txt
          # the same local eliminations by exhaustion over all points modulo p^N (no code shared with cover_descent.py), prime by prime
          python3 cover_certificate.py 627,364 | diff - cover_certificate_627_364.txt
          grep -q "^left by the descent: \[521266\]; left by the exhaustion: \[521266\];" cover_certificate_627_364.txt
          # the two methods end with the same set, but not with the same set at every prime: 17 of 18 for (627,364) and (820,799), 18 of 18 for (889,320)
          test "$(grep -c "the same set$" cover_certificate_627_364.txt)" = 17
          test "$(grep -c "the same set$" cover_certificate_820_799.txt)" = 17
          test "$(grep -c "the same set$" cover_certificate_889_320.txt)" = 18
          # section 12: one class for each form; all lists, under a second per ratio
          python3 tuple_descent.py magic 627,364 | diff - tuple_627_364.txt
          (for r in 627,364 820,799 15,8 247,96; do python3 tuple_descent.py magic $r selftest; done) | diff - tuple_selftest.txt
          test "$(grep -c "outside the allowed set: 0$" tuple_selftest.txt)" = 4
          # tests of the local class rules (LAST_PAIR.md, section 14): points near the zeros of the forms; a second implementation with lists of squares; two wrong rules that it has to catch
          (for r in 627,364 820,799 440,279 4,3; do python3 tuple_descent.py magic $r neartest; python3 tuple_descent.py magic $r oracle; done) | diff - tuple_neartest.txt
          test "$(grep -c "outside the allowed set: 0$\|disagreements: 0$" tuple_neartest.txt)" = 8
          python3 tuple_mutation.py | diff - tuple_mutation.txt
          # the same test near the zeros of the forms on twelve more ratios and four bases of the cuboid system (the rule R4 of section 14)
          (for r in 15,8 247,96 440,99 991,263 889,320 724,665 1073,264 4664,873 4828,3885 2365,588 308,185 493,123; do python3 tuple_descent.py magic $r neartest; done; for r in 15,8 17,16 19,16 26,23; do python3 tuple_descent.py cuboid $r neartest; done) | diff - tuple_neartest_more.txt
          test "$(grep -c "outside the allowed set: 0$" tuple_neartest_more.txt)" = 16
          python3 tuple_bruteforce.py magic 627,364 | diff - tuple_bruteforce_627_364.txt
          grep -q "^kept at every prime: 2: \[(1, 2, 263, 991), (1, 2, 1982, 526)\]$" tuple_bruteforce_627_364.txt
          python3 tuple_descent.py batch magic ../gauss_descent/pairs34.txt 2 | diff - tuple_34.txt
          python3 tuple_descent.py batch magic ../second_descent/pairs123.txt 2 | diff - tuple_123.txt
          python3 tuple_descent.py batch magic ../gauss_descent/pairs_notrivial_1000.txt 2 | diff - tuple_681.txt
          python3 tuple_descent.py batch magic pairs_route_wide.txt 2 | diff - tuple_route_wide.txt
          test "$(cat tuple_34.txt tuple_681.txt | grep -c "nothing is left$")" = 715
          test "$(cat tuple_123.txt tuple_route_wide.txt | grep -c "exactly the known points$")" = 138
          # every ratio with m <= 5000 that avoids the 484 classes: the first lines are rerun, the counts are checked on the whole files
          python3 tuple_descent.py batch magic ../gauss_descent/scan_certificates.txt 2 0 300 | diff - <(head -n 300 tuple_scan_5000.txt)
          python3 tuple_descent.py batch magic pairs_trivial_5000.txt 2 0 60 | diff - <(head -n 60 tuple_trivial_5000.txt)
          test "$(wc -l < tuple_scan_5000.txt)" = 18900
          test "$(grep -c "nothing is left$" tuple_scan_5000.txt)" = 18900
          test "$(wc -l < tuple_trivial_5000.txt)" = 1523
          test "$(grep -c "exactly the known points$" tuple_trivial_5000.txt)" = 1523
          diff <(cut -d: -f1 tuple_scan_5000.txt | tr -d '()') <(cut -d' ' -f1 ../gauss_descent/scan_certificates.txt)
          # RATIONAL_DISTANCE.md: the lines with denominator up to 40, the curve, the control with three distances; counts of the whole files
          cd ../rational_distance
          # whole output to a file first (head on a live pipe can end it early under pipefail); the summary line is checked too
          rdo=$(mktemp); python3 rd.py scan 2 40 > "$rdo"; head -n 244 "$rdo" | diff - <(head -n 244 rd_scan_2_300.txt)
          test "$(wc -l < "$rdo")" = 245
          test "$(tail -n 1 "$rdo")" = "lines y = r/s with 2 <= s <= 40, 0 < r/s < 1/2: 244; tuples left (number: lines): [(1, 1), (2, 183), (4, 60)]; lines with a tuple whose four classes are not all equal: 0 []"
          test "$(grep -c " equal$" rd_scan_2_300.txt)" = 13697
          test "$(grep -c "MIXED" rd_scan_2_300.txt)" = 1
          grep -q "^26/225 12 MIXED" rd_scan_2_300.txt
          test "$(grep -c " equal$" rd_scan_outside_60.txt)" = 2204
          python3 rd.py curve | diff - rd_curve.txt
          test "$(grep -c "equal: True$" rd_curve.txt)" = 22
          python3 rd.py control | diff - rd_control.txt
          python3 rd_prop1.py | diff - rd_prop1.txt
          grep -qx 'PROP1 OK' rd_prop1.txt
          python3 si_criterion_test.py 4 2>/dev/null | tail -2 > /tmp/si.txt
          grep -q 'with all hypotheses (would contradict the criterion): 0$' /tmp/si.txt
          grep -q 'with all hypotheses (would contradict the criterion): 0$' si_criterion_test.txt
          grep -q 'lower bound 1 and upper bound 1 for the rank$' /tmp/si.txt
          grep -q 'lower bound 1 and upper bound 1 for the rank$' si_criterion_test.txt
          test "$(grep -c 'the descent set is inside the exhaustion set: True' rd_exhaust.txt)" = 6
          pip install -q numpy==2.5.5
          cd ../cover_descent/third
          python3 third_run.py @pairs_other.txt 150 | diff - third_other.txt
          python3 third_run.py "627,364 991,263 820,799 889,320" 150 | diff - <(grep -E '^\((627,364|991,263)\)' third_123.txt; grep -E '^\((820,799|889,320)\)' third_34.txt)
          python3 third_compare.py @../../gauss_descent/pairs34.txt @pairs_123.txt @pairs_other.txt | diff - third_compare.txt
          grep -qx 'witness test (every class with an explicit local point found is allowed by the descent): 3024 of 3024' third_compare.txt
          grep -qx 'no pair where the descent rejects a class that has an explicit local point' third_compare.txt
          cd ../structure
          python3 class_structure.py 2 100 | diff - class_structure_100.txt
          grep -q 'of these divisible by q: 0;' class_structure_100.txt
          grep -q 'of these not = 2 mod 4: 0$' class_structure_100.txt
          grep -q 'of these with (d/p) = -1: 0$' class_structure_100.txt
          # Theorems F and G of LAST_PAIR.md, section 17, by brute force over all residues
          python3 class_fg.py | diff - class_fg.txt
          # what Theorems E, F, G, O decide by themselves (CLASS.md, section 3)
          python3 class_struct.py | diff - class_struct.txt
          grep -q 'no candidate passes E, F, G, O: 54$' class_struct.txt
          python3 class_law5.py | diff - class_law5.txt
          python3 class_complete.py | diff - class_complete.txt
          python3 class_good.py --check 700
          pip install -q sympy==1.14.0
          python3 class_selmer.py | diff - class_selmer.txt
          grep -qx '  the criterion and the local test at the primes below 620 leave the same classes for 425 ratios of 425' class_selmer.txt
          # review of 0b34613: Propositions A and B of COMPLETE.md, the rule at 2, the rows E, the weakness of Passes
          python3 class_gaps.py | diff - class_gaps.txt
          # review of 7b4ff7a: the first definition of Passes lets the class p through at p = 3 (mod 8) (a control that
          # the test of passes_tight.py, rerun in full in scan-5000, can fail)
          python3 passes_tight.py --weak | diff - passes_tight_weak.txt
          grep -q '^first definition (no roots), cases 10; classes outside the row that pass: 20; ' passes_tight_weak.txt
          test "$(grep -c 'points where every form could be a q-adic square: 0$' class_gaps.txt)" = 2
          grep -q 'not of the shape used (four points, two forms each, full product a square): 0; with 16N below 2q - 76 - 42 sqrt(q): 0;' class_gaps.txt
          grep -q 'all = +-1 (mod 8): True; ' class_gaps.txt
          grep -q 'differs from the rule "4 | mn or m = +-n (mod 8)": 0$' class_gaps.txt
          test "$(grep -c 'p times each product a square in Z_p\[i\]: True; the point in X_p: False$' class_gaps.txt)" = 6
          # the four-class descent on the 997 ratios of COMPLETE.md, section 7, test 4 (about a minute)
          cd ..
          python3 tuple_descent.py batch magic structure/class_selmer_997.txt 4 | diff - tuple_selmer_997.txt
          test "$(grep -c 'nothing is left$' tuple_selmer_997.txt)" = 997
          cd structure
          grep -q '^1. random points with a class: 211894; outside the set of Theorem C: 0$' class_local.txt
          grep -q 'not as the proof says: 0$' class_local.txt
          grep -q 'different from the table of Theorem C: 0$' class_local.txt
          grep -qx 'excluded locally at a bad prime but allowed by the laws: 0' class_complete.txt
          python3 class_complete_random.py 200 1500 3000 | diff - class_complete_random.txt
          grep -qx 'excluded locally at a bad prime but allowed by the laws: 0' class_complete_random.txt
          grep -qx 'excluded locally at a bad prime but allowed by the laws: 0' class_complete_random_20000.txt
          grep -qx '(point, d = ±1 mod 5) tested: 1920000; passing: 0' class_law5.txt
          grep -q 'candidates that pass for (627,364): \[521266\]; for (991,263): \[521266\]$' class_struct.txt
          test "$(grep -c 'odd among them 0$' class_fg.txt)" = 2
          test "$(grep -c 'non-residues among them 0$' class_fg.txt)" = 4
          # the four-class comparison of a second reviewer (rerun in the job scan-5000): the committed outputs say what the text says
          cd ../fourth
          grep -q "^STAT {'cases': 723, 'L_in_R': 723, 'R_in_U': 723, 'U_in_R': 722," compare_out.txt
          grep -qx "ALL: {'cases': 1752, 'L_in_R': 1752, 'R_in_U': 1752, 'U_in_R': 1752, 'all3': 1732}" attack_out.txt
          grep -q "^mutation 'hint with the residue symbol reversed': 24 (base, prime) pairs; allowed set changes at 8, strictly larger at 8, a tuple with a witness is rejected at 0, a tuple that the exhaustion removes is allowed at 8$" mut_hint_out.txt
          cd ../structure
          cd ../../perfect_triangle
          python3 pt.py scan 1 25 0.867 | head -n -1 | diff - <(head -n 174 pt_scan_200.txt)
          test "$(grep -c ' degenerate-only$' pt_scan_200.txt)" = 10604
          test "$(wc -l < pt_scan_200.txt)" = 10605
          python3 pt_second.py 2>/dev/null | grep -v "PARI stack" | diff - pt_second.txt
          grep -q '^{z, z-1, z+1, z-2}: D=+1: cond 24, rank bounds \[0, 0\], torsion \[4, 2\] | D=-1: cond 48, rank bounds \[0, 0\]' pt_second.txt
          python3 pt_control.py | diff - pt_control.txt
          python3 pt_count.py | diff - pt_count.txt
          grep -qx '#E(F_5) = 8' pt_count.txt
          grep -qx '#E(F_13) = 16' pt_count.txt
          test "$(grep -c 'kept by the 4-form first step: True' pt_control.txt)" = 5
          cd ../rational_distance
          cd ../cover_descent
          cd ../second_descent
          grep -q "G has infinite order for every other rational tau: True$" degenerate_section.txt
          grep -q "^all identities hold: True$" lemma2_general.txt
          python3 height_enclosure.py 627,364 521266 | grep -v "PARI stack" | diff - height_enclosure_627_364.txt
          python3 saturation.py 627,364 521266 | grep -v "PARI stack" | diff - saturation_627_364.txt
          python3 closure_estimate.py 627,364 521266 59630999 | grep -v "PARI stack" | diff - closure_estimate_627_364.txt
          python3 fibre.py 627,364 521266 | grep -v "PARI stack" | diff - fibre_627_364.txt
          (for r in 2,1 3,2 10,3 4,1 4,3 5,2; do python3 planted_control.py $r 30; done) | grep -v "PARI stack" | diff - planted_control.txt
          cd ../gauss_descent
          python3 subsets_summary.py | diff - subsets_summary.txt
          cd ../hill
          python3 hill_identity.py | diff - hill_identity.txt
          python3 hill_check.py | diff - hill_check.txt
          python3 ap_relaxed.py 250 | diff - ap_relaxed_250.txt
          gcc -O2 -Wall -Wextra -Werror -fopenmp -o /tmp/ap_exact ap_exact.c
          /tmp/ap_exact 250 | diff - ap_exact_250.txt

  four-points:
    # The four-point argument (FOUR_POINTS.md) run as a program, not only checked through its records:
    # the model and the identities with m, n as indeterminates; every record of dm4.py regenerated with PARI and Sage
    # and compared with the committed one; Proposition 1 on actual rational points of quadratic twists.
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[full ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: dm4_identities.py, dm4.py on all 52 pairs, dm4_twist.py on 12 pairs, the Gaussian descent on the 157 ratios
        shell: bash
        run: |
          set -e -o pipefail
          pip install -q -r scripts/g1_full/requirements.txt
          cd scripts/g1_full
          (cd ../gauss_descent && python3 gauss_descent.py 820,799 889,320 4,3 72,65 | sed 's/  \[[0-9.]* s\]$//' | diff - ci_expected.txt && python3 gauss_descent.py --pmax=150 $(cat pairs_notrivial_1000.txt) | sed 's/  \[[0-9.]* s\]$//' | diff - gauss_descent_notrivial_1000.txt)
          (cd ../gauss_descent && python3 gd_check.py $(cat pairs34.txt) | diff - gd_check_34.txt && python3 gauss_descent.py --pmax=200 $(cat pairs157.txt) | sed 's/  \[[0-9.]* s\]$//' | diff - gauss_descent_157.txt) &
          GAUSS=$!
          python3 dm4_twist.py 72,65 137,7 425,168 593,257 920,129 740,539 828,173 840,83 923,757 15,8 21,20 41,1 3 400 > /tmp/dm4_twist.out &
          TWIST=$!
          python3 dm4_identities.py | tee /tmp/dm4_identities.out
          diff <(sed 's/ *\[[0-9]* s\]//' /tmp/dm4_identities.out) <(sed 's/ *\[[0-9]* s\]//' dm4_identities.txt)
          mkdir /tmp/fresh
          grep -v '#' dm4_pairs.txt | xargs -P 4 -I{} sh -c 'python3 dm4.py {} > /tmp/fresh/{}.jsonl'
          cat /tmp/fresh/*.jsonl > /tmp/dm4_fresh.jsonl
          test "$(wc -l < /tmp/dm4_fresh.jsonl)" = 52
          python3 check_evidence.py --dm4 /tmp/dm4_fresh.jsonl
          wait $GAUSS
          wait $TWIST
          diff <(sed 's/   \[[0-9]* s\]$//' /tmp/dm4_twist.out) dm4_twist.txt
          grep -q "^72 configurations on twists, 0 outside the bounds" /tmp/dm4_twist.out
      - name: dm_sigma.py and sigma_certify.py on the census ratios they close (G1_FULL_SYSTEM.md, the curves of F0*F8*GL)
        shell: bash
        run: |
          set -e -o pipefail
          cd scripts/g1_full
          python3 dm_sigma.py --effort=4 --magma=magma_sigma2_raw.txt,magma_sigma3_raw.txt 91,60 209,120 420,341 572,555 608,105 680,111 741,580 760,39 945,248 > /tmp/sigma_fresh.jsonl
          python3 dm_sigma.py --magma=magma_sigma2_raw.txt,magma_sigma3_raw.txt 72,65 920,129 > /tmp/sigma_fresh2.jsonl
          python3 check_sigma.py /tmp/sigma_fresh2.jsonl | grep -q '^OK$'
          python3 check_sigma.py /tmp/sigma_fresh.jsonl | tee /tmp/sigma_check.txt
          grep -q "^of the 24 ratios open in the census before 24 November 2026: 15 closed" /tmp/sigma_check.txt
          grep -q "^OK$" /tmp/sigma_check.txt
          python3 sigma_certify.py 91,60:E+ 91,60:E- 209,120:E- 420,341:E- 572,555:E- 608,105:E+ 680,111:E- 741,580:E+ 760,39:E+ 945,248:E+ 72,65:E+ 920,129:E+ | grep -v 'PARI stack' > /tmp/sigma_evidence.txt
          python3 sigma_exact.py --same-group /tmp/sigma_evidence.txt   # PARI may return -G or G + T: compared exactly up to those
          python3 sigma_twice.py | diff - sigma_twice.txt

  descents:
    # GAUSS_DESCENT.md and SECOND_DESCENT.md are experiments, not counted in the census. This job reruns the second descent
    # (all 24 curves on the 123 ratios), its controls, and the tests of the first descent on real numbers.
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[full ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: second descent on 123 ratios, planted points, L-values, Magma transcripts; Lemma, local sets and labels on real points
        shell: bash
        run: |
          set -e -o pipefail
          pip install -q -r scripts/g1_full/requirements.txt
          cd scripts/second_descent
          python3 second_descent.py --all $(cat pairs123.txt) | diff - second_123.jsonl
          python3 second_descent.py --summary second_123.jsonl | diff - second_summary.txt
          python3 second_control.py | diff - second_control.txt
          python3 degenerate_tuples.py pairs123.txt | diff - degenerate_tuples.txt
          (for k in 1 3 5 7; do python3 planted.py 30 60 $k | grep -v "^m:n"; done) | diff - planted.txt
          python3 magma_check.py | diff - magma_check.txt
          python3 kdescent_test.py 1 300 | diff - kdescent_test.txt
          python3 lproof.py 1e14 second_123.jsonl | grep -v "PARI stack" | diff - lproof.txt
          pip install -q python-flint==0.9.0
          python3 lball.py 1e14 second_123.jsonl | grep -v "PARI stack" | diff - lball.txt
          python3 lball.py curve 0,-491040,0,-13400146081,0 '(440,279), curve y^2 = x(x - 719^2)(x + 161^2), the twist by -1 of the Frey curve:' | grep -v "PARI stack" | diff - lball_440_279.txt
          python3 lvalue_close.py 1e13 $(python3 -c "import json; print(' '.join('%d,%d' % tuple(json.loads(l)['pair']) for l in open('second_123.jsonl') if json.loads(l)['status'] == 'open'))") | grep '^{' | diff - lvalue_open.jsonl
          python3 tally.py second_123.jsonl lvalue_open.jsonl | diff - tally.txt
          python3 wide.py 1000 1020 ../g1_full/modp_classes.txt | diff - <(head -n 5 wide_1000_2000.jsonl)
          python3 wide.py --summary wide_1000_2000.jsonl | diff - wide_summary.txt
          python3 indep_class.py 195,28 223,167 440,279 719,161 627,364 609,200 809,409 861,620 991,263 | diff - indep_class.txt
          python3 indep_class.py --selftest | diff - indep_class_selftest.txt
          python3 indep_fourclass.py | diff - indep_fourclass.txt
          python3 indep_rank.py magma_second_ranks.json | grep -v "PARI stack" | diff - indep_rank.txt
          python3 indep_rank.py --selftest | grep -v "PARI stack" | diff - indep_rank_selftest.txt
          python3 indep_second.py | grep -v "PARI stack" | diff - indep_second.txt
          python3 indep_second.py --selftest | grep -v "PARI stack" | diff - indep_second_selftest.txt
          cd ../gauss_descent
          python3 real_points.py 300 $(cat pairs157.txt) | diff - real_points_157.txt
          python3 local_points.py $(cat pairs157.txt) | diff - local_points_157.txt
          python3 hilbert_check.py 3000 | diff - hilbert_check.txt
          python3 subsets.py 4,3 15,8 59,56 820,799 889,320 | diff - subsets.txt
          python3 twocover_check.py | diff - twocover_check.txt
          python3 subsets.py $(python3 -c "import math; print(' '.join('%d,%d' % (m, n) for m in range(2, 10) for n in range(1, m) if math.gcd(m, n) == 1))") | diff - <(head -n 27 subsets_small.txt)
          python3 gd_control.py 1 100 | diff - gd_control.txt
          python3 scan.py 1000 1100 ../g1_full/modp_classes.txt /tmp/scan_list.txt | sed 's/  \[[0-9]* s\]$//' | diff - scan_1000_1100.txt
          diff /tmp/scan_list.txt <(awk -F'[, ]' '$1 <= 1100' scan_certificates.txt)
          python3 gd_check.py --pmax=100 $(cat pairs_scan_high.txt) | diff - gd_check_scan_high.txt
          cd ../hill
          gcc -O2 -Wall -Wextra -Werror -fopenmp -o /tmp/ap_exact ap_exact.c
          /tmp/ap_exact 1000 | diff - ap_exact_1000.txt

  last-pair:
    # LAST_PAIR.md: the argument for (627,364) and (991,263). An experiment, not counted in the census. This job reruns every
    # computation of it: the generator, the constants of the height bound, both sieves, the fibre, and the planted control.
    # Magma is not run; its answers are in magma_last_pair_raw.txt.
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[full ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: generator, constants, sieves to 596,309 and to 59,631,000, fibre, planted control
        shell: bash
        run: |
          set -e -o pipefail
          pip install -q -r scripts/g1_full/requirements.txt numpy==2.5.5
          cd scripts/second_descent
          f() { grep -v "PARI stack" || true; }
          python3 saturation.py 627,364 521266 | f | diff - saturation_627_364.txt
          python3 closure_estimate.py 627,364 521266 59630999 | f | diff - closure_estimate_627_364.txt
          python3 fibre.py 627,364 521266 | f | diff - fibre_627_364.txt
          (for r in 2,1 3,2 10,3 4,1 4,3 5,2; do python3 planted_control.py $r 30; done) | f | diff - planted_control.txt
          python3 mw_sieve.py 627,364 521266 1000000 10009 20089 30013 40009 | f | diff - mw_sieve_627_364.txt
          python3 mw_sieve_big.py 627,364 521266 100 10009 20089 30013 40009 50021 60013 | f | diff - mw_sieve_big_627_364.txt
          # the whole route on (440,279), closed by an L-value on another curve, and the sieve on (99,20)
          python3 saturation.py 440,279 231518 | f | diff - saturation_440_279.txt
          python3 closure_estimate.py 440,279 231518 30000 | f | diff - closure_estimate_440_279.txt
          python3 fibre.py 440,279 231518 | f | diff - fibre_440_279.txt
          python3 mw_sieve.py 440,279 231518 1000000 10009 20089 30013 40009 | f | diff - mw_sieve_440_279.txt
          python3 mw_sieve.py 99,20 18802 1000000 10009 20089 30013 40009 | f | diff - mw_sieve_99_20.txt
          # the whole route on the 24 ratios of square type with E1 of rank exactly 1
          python3 route_all.py 4 | diff - route_all.txt
          # the same on the ratios of square type left with 1000 < m <= 3000 whose E1 has rank exactly 1
          python3 two_map_scope.py pairs_wide_open.txt | f | diff - two_map_scope_wide.txt
          python3 route_all.py 4 two_map_scope_wide.txt | diff - route_wide.txt
          python3 route_all.py 4 two_map_scope_wide_twist.txt | diff - route_twist.txt
          # the cover descent on the 157 ratios of the census list
          (cd ../cover_descent && python3 cover_batch.py ../gauss_descent/pairs34.txt 4 | diff - cover_34.txt && python3 cover_batch.py ../second_descent/pairs123.txt 4 | diff - cover_123.txt)
          (cd ../cover_descent && for r in 820_799 889_320; do python3 cover_certificate.py $(echo $r | tr _ ,) | diff - cover_certificate_$r.txt && grep -q "^left by the descent: \[\]; left by the exhaustion: \[\];" cover_certificate_$r.txt || exit 1; done)
          test "$(grep -c "no class is possible" ../cover_descent/cover_34.txt)" = 34
          test "$(grep -c "generator: True; .*within the bound: \[(1, 1)\]; range covers the bound: True; fibre over a = 1 or b = 1: rational t = -1, 1$" route_wide.txt)" = 12
          test "$(grep -c "generator: True; .*within the bound: \[(1, 1)\]; range covers the bound: True; fibre over a = 1 or b = 1: rational t = -1, 1$" route_all.txt)" = 24
          grep -q "^left: \[(1, 1)\]$" mw_sieve_627_364.txt
          test "$(cat mw_sieve_627_364.txt mw_sieve_big_627_364.txt | grep -c "^test of the lifting: .* all of them returned: True; returned beyond them and the pairs left[a-z ]*: \[\]$")" = 2
          grep -q "^left: \[(1, 1)\]$" mw_sieve_big_627_364.txt
          test "$(grep -c "the planted pair (2, 1) survives; survivors: \[(0, 1), (2, 1)\]" planted_control.txt)" = 3
          test "$(grep -c "14 of 14" planted_control.txt)" = 6

  twist-search:
    # scripts/search/twist_search.txt: no t0 = p/q != 1 with m, p, q <= 400 at which all four points are rational on a twist.
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[full ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: twist_find to 400
        shell: bash
        run: |
          set -e
          gcc -O2 -Wall -Wextra -Werror -o /tmp/twist_find scripts/search/twist_find.c -lm
          /tmp/twist_find 400 400 2 200 > /tmp/tw1.out &
          P1=$!
          /tmp/twist_find 400 400 201 283 > /tmp/tw2.out &
          P2=$!
          /tmp/twist_find 400 400 284 346 > /tmp/tw3.out &
          P3=$!
          /tmp/twist_find 400 400 347 400 > /tmp/tw4.out &
          P4=$!
          wait $P1; wait $P2; wait $P3; wait $P4
          test ! -s /tmp/tw1.out
          test ! -s /tmp/tw2.out
          test ! -s /tmp/tw3.out
          test ! -s /tmp/tw4.out
          grep -qx 'twist_find 400 400: 0 solutions' scripts/search/twist_search.txt

  scan-15000:
    # COMPLETE.md, section 7, test 7 (review of 7b4ff7a): the criterion by linear algebra on every coprime ratio with
    # 5000 < m <= 15000, and the four-class descent on every ratio of that range that is not of the two degenerate types
    # and keeps a class.
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[full ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: criterion and four-class descent, 5000 < m <= 15000
        shell: bash
        run: |
          set -e -o pipefail
          pip install -q sympy==1.14.0 cypari2==2.2.9
          cd scripts/cover_descent/structure
          test "$(python3 class_selmer_linalg.py 5010 5010 --from 5000 | grep -c '[1-9][0-9]* ratios, 0 different')" = 1   # a comparison with class_selmer.py that is not empty
          python3 class_selmer_linalg.py 10000 0 --from 5000 --list /tmp/a.txt > /tmp/sa.txt &
          python3 class_selmer_linalg.py 15000 0 --from 10000 --list /tmp/b.txt > /tmp/sb.txt &
          wait
          cat /tmp/sa.txt /tmp/sb.txt | diff - class_selmer_linalg_15000.txt
          cat /tmp/a.txt /tmp/b.txt | diff - class_selmer_15000_list.txt
          cd ..
          python3 tuple_descent.py batch magic structure/class_selmer_15000_list.txt 4 | diff - tuple_selmer_15000.txt
          test "$(grep -c 'nothing is left$' tuple_selmer_15000.txt)" = "$(wc -l < structure/class_selmer_15000_list.txt)"

  scan-5000:
    # LAST_PAIR.md, section 12: the four-class descent on EVERY ratio with m <= 5000 that avoids the 484 classes, rerun in
    # full (18,900 + 1,523 ratios) and compared with the committed files; and the rational-distance scan to denominator 300.
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[full ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: tuple descent to 5000, in full; rational distance to 300
        shell: bash
        run: |
          set -e -o pipefail
          pip install -q sympy==1.14.0
          cd scripts/cover_descent
          python3 tuple_descent.py batch magic ../gauss_descent/scan_certificates.txt 4 | diff - tuple_scan_5000.txt
          python3 tuple_descent.py batch magic pairs_trivial_5000.txt 4 | diff - tuple_trivial_5000.txt
          cd ../rational_distance
          python3 rd.py scan 2 300 | diff - rd_scan_2_300.txt
          python3 rd.py scan 1 60 3 | diff - rd_scan_outside_60.txt
          python3 rd_exhaust.py 1,3 2,5 3,7 1,8 7,16 26,225 | diff - rd_exhaust.txt
          pip install -q numpy==2.5.5
          cd ../cover_descent/third
          python3 third_run.py @../../gauss_descent/pairs34.txt 150 | diff - third_34.txt
          python3 third_run.py @pairs_123.txt 150 | diff - third_123.txt
          cd ../structure
          python3 class_two.py | diff - class_two.txt
          # the checks for Theorem C (COMPLETE.md): exact p-adic classes; about three minutes
          python3 class_local.py | diff - class_local.txt
          # COMPLETE.md, section 7 (review of 0b34613): the table of Theorem C' in full (enumeration to 4400; about four
          # minutes) and the criterion on every coprime ratio with m <= 5000 and on the lists of LAST_PAIR.md, section 12
          python3 class_good.py | diff - class_good.txt
          git diff --exit-code class_good_table.txt
          pip install -q cypari2==2.2.9      # faster factoring for class_selmer.py; the output is the same with sympy
          python3 class_selmer.py --all 5000 | diff - class_selmer_all_5000.txt
          python3 class_selmer.py --lists | diff - class_selmer_lists.txt
          python3 class_selmer_linalg.py 5000 1000 | diff - class_selmer_linalg.txt
          # a sample of 40 of the 997 by exhaustion (tuple_bruteforce.py: no valuations, no code shared with tuple_descent.py)
          cd ..
          cat structure/tuple_bruteforce_997_sample.txt | xargs -P 4 -I{} sh -c 'echo "({}) $(python3 tuple_bruteforce.py magic {} 150 5000 | tail -1)"' | LC_ALL=C sort | diff - structure/tuple_bruteforce_997_sample_out.txt
          test "$(grep -c 'kept at every prime: 0: \[\]$' structure/tuple_bruteforce_997_sample_out.txt)" = 40
          # review of 7b4ff7a: the repaired Passes against the table in both directions at finite powers (three minutes),
          # and the four-class descent with the bad primes only (COMPLETE.md, section 7, test 6)
          python3 structure/passes_tight.py | diff - structure/passes_tight.txt
          grep -qx 'cases 23; classes outside the row that pass: 0; classes of the row that do not pass: 0' structure/passes_tight.txt
          python3 tuple_badprimes.py structure/class_selmer_997.txt | diff - tuple_badprimes_997.txt
          cd structure
          cd ../fourth
          python3 compare.py | sed 's/  \[[0-9]*s\]$//' | diff - compare_out.txt
          python3 attack.py | sed 's/ [0-9]*s$//' | diff - attack_out.txt
          python3 mut.py | diff - mut_out.txt
          python3 mut_hint.py | diff - mut_hint_out.txt
          cd ../../perfect_triangle
          python3 pt.py scan 1 200 0.867 | diff - pt_scan_200.txt
