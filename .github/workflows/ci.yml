          python3 $G/g4k_exact.py --negative 2>/dev/null | f5 | diff - $G/g4k_exact_negative.txt
          python3 $G/g4k_rank_exact.py 2>/dev/null | f5 | diff - $G/g4k_rank_exact.txt
          python3 $G/g4k_rank_exact.py --negative 2>/dev/null | f5 | diff - $G/g4k_rank_exact_negative.txt
          python3 $G/dm_g4k.py 2>/dev/null | f5 | diff - $G/dm_g4k.jsonl
          python3 $G/dm_g4k.py --negative 2>/dev/null | f5 | diff - $G/dm_g4k_negative.txt
          for k in 3 4; do python3 $K/f2_general.py $k 2>/dev/null | f5 | diff - $K/f2_general_$k.log; done
          python3 $K/f2_general_neg.py 2>/dev/null | f5 | diff - $K/f2_general_negative.txt
          python3 $K/f2_d1_local2.py 2>/dev/null | f5 | diff - $K/f2_d1_local2.txt
          python3 $K/f2_d1_local2.py --negative 2>/dev/null | f5 | diff - $K/f2_d1_local2_negative.txt
          for k in 0 1 2; do python3 $K/f2_pairing.py $k 2>/dev/null | f5 | diff - $K/f2_pairing_$k.log; done
          # run 6 (experiments/, tier D): Fable run 5 part 2: the census table 1000 < m <= 11000 (bookkeeping) and its
          # controls; the streamed exact L-value's controls and the (6557,324) record (conditional on PARI's ellap; the six
          # sums are not recomputed); the review's recount, spot check, congruence lists, torsion step (about 1.5 minutes)
          cd "$GITHUB_WORKSPACE"
          T=experiments/census-wide/table; V=experiments/census-wide/lvalue; X=experiments/referee_x4
          python3 $T/census_table.py 2>/dev/null | f5 | diff - $T/census_table.txt
          python3 $T/census_table.py --negative 2>/dev/null | f5 | diff - $T/census_table_negative.txt
          python3 $V/stream_selftest.py 2>/dev/null | f5 | diff - $V/selftest.txt
          MSS_STREAM_TEST=1 python3 $V/lvalue_stream.py --negative-small 2>/dev/null | f5 | diff - $V/test_lball/negative_small.txt
          MSS_PAIR=6557,324 MSS_CURVE='w*f0*f8' python3 $V/lvalue_stream.py --merge $V/r6557 2>/dev/null | f5 | diff - $V/r6557/record.json
          MSS_PAIR=6557,324 MSS_CURVE='w*f0*f8' python3 $V/lvalue_stream.py --negative $V/r6557 2>/dev/null | f5 | diff - $V/r6557/negative.txt
          python3 $X/recount.py 2>/dev/null | diff - $X/recount.txt
          python3 $X/recount.py --negative 2>/dev/null | diff - $X/recount_negative.txt
          python3 $X/spot.py 2>/dev/null | diff - $X/spot.txt
          python3 $X/congr.py 2>/dev/null | diff - $X/congr.txt
          python3 $X/tors6557.py 2>/dev/null | f5 | diff - $X/tors6557.txt
          python3 $X/compare_samples.py 2>/dev/null | diff - $X/compare_samples.txt
          # run 6: Theta_4 by the general module: (72,65) again, (920,129), (760,39), D1 of (631,71) via E'; refusals,
          # controls, re-check, order, the Weil-reciprocity test of div g0 (about 3.5 minutes)
          cd "$GITHUB_WORKSPACE/scripts/g1_full"
          for n in 72,65 920,129 760,39; do t=$(echo $n | tr , _)
            python3 rank_fisher_theta4_gen.py $n 2>/dev/null | grep -v 'PARI stack' | diff - rank_fisher_theta4_gen_$t.txt
            python3 rank_fisher_theta4_gen.py $n --negative 2>/dev/null | grep -v 'PARI stack' | diff - rank_fisher_theta4_gen_${t}_negative.txt
          done
          python3 rank_fisher_theta4_gen.py 631,71 "--side=E'" 2>/dev/null | grep -v 'PARI stack' | diff - rank_fisher_theta4_gen_631_71_Eprime.txt
          python3 rank_fisher_theta4_gen.py 631,71 "--side=E'" --negative 2>/dev/null | grep -v 'PARI stack' | diff - rank_fisher_theta4_gen_631_71_Eprime_negative.txt
          for s in rank_fisher_theta4_gen_control rank_fisher_theta4_gen_recheck rank_fisher_theta4_gen_order rank_fisher_theta4_gen_weil; do
            python3 $s.py 2>/dev/null | grep -v 'PARI stack' | diff - $s.txt
          done
          python3 rank_fisher_theta4_gen_order.py --negative 2>/dev/null | diff - rank_fisher_theta4_gen_order_negative.txt
          # run 8: Theta_4 on E+ of (945,248), E' side, and the conic finder's re-check (its --find prints timings: grepped)
          python3 rank_fisher_theta4_gen.py 945,248 "--side=E'" 2>/dev/null | grep -v 'PARI stack' | diff - rank_fisher_theta4_gen_945_248_Eprime.txt
          python3 rank_fisher_theta4_gen.py 945,248 "--side=E'" --negative 2>/dev/null | grep -v 'PARI stack' | diff - rank_fisher_theta4_gen_945_248_Eprime_negative.txt
          python3 rank_fisher_theta4_norm.py 2>/dev/null | grep -v 'PARI stack' | diff - rank_fisher_theta4_norm.txt
          test "$(python3 rank_fisher_theta4_norm.py --find 2>/dev/null | grep -c 'equal to the committed hint: True')" = 2
          cd "$GITHUB_WORKSPACE"
          # run 6 (experiments/roadmap-g, tier D): the exact local test and its controls; two ranges of the stress test
          # (k = 20 holds the control (1109503,597671)); G2's tables, negative test and 2-adic witnesses; G3's table;
          # G4's bookkeeping and negative test; the review's own checks (about 2.5 minutes)
          cd "$GITHUB_WORKSPACE"
          R=experiments/roadmap-g; Q=experiments/referee_x6
          python3 $R/g1/test_exact_local.py 2>/dev/null | f5 | diff - $R/g1/test_exact_local.txt
          for k in 13 20; do python3 $R/g1/g1_stress.py $k 20000 200 2>/dev/null | f5 | diff - $R/g1/g1_k$k.txt; done
          python3 $R/g1/g1_stress.py --negative 2>/dev/null | f5 | diff - $R/g1/g1_negative.txt
          python3 $R/g1/g1_summary.py | diff - $R/g1/g1_summary.txt
          python3 $R/g2/g2_check.py 2>/dev/null | f5 | diff - $R/g2/g2_summary.txt
          python3 $R/g2/g2_check.py --negative 2>/dev/null | f5 | diff - $R/g2/g2_negative.txt
          for L in 997 15000; do python3 $R/g2/g2_features.py g2_${L}_all.txt 2>/dev/null | f5 | diff - $R/g2/g2_features_$L.txt; done
          python3 $R/g2/g2_badalone_witness.py $R/g2/g2_997_all.txt 2>/dev/null | f5 | diff - $R/g2/g2_badalone_witness_g2_997_all.txt
          python3 $R/g3/g3_table.py | f5 | diff - $R/g3/g3_table.txt
          python3 $R/g3/g3_table.py --negative | f5 | diff - $R/g3/g3_table_negative.txt
          python3 $R/g4/g4_summary.py 2>/dev/null | f5 | diff - $R/g4/g4_summary.txt
          python3 $R/g4/g4_search.py --negative 2>/dev/null | f5 | diff - $R/g4/g4_negative.txt
          python3 $R/g4/gen_square.py 20000 | tail -1 | grep -qx '# matches square_20000.json'
          python3 $Q/local_compare.py 2>/dev/null | f5 | diff - $Q/local_compare.txt
          python3 $Q/weil_check.py 2>/dev/null | f5 | diff - $Q/weil_check.txt
          python3 $Q/local_mutation.py 2>/dev/null | f5 | diff - $Q/local_mutation.txt
          python3 $Q/g3_family.py | diff - $Q/g3_family.txt
          python3 $Q/g3_sample.py | diff - $Q/g3_sample.txt
          python3 $Q/samples/compare.py | diff - $Q/samples/compare.txt
          # run 7 (tier D, not counted): Fable's roadmap H (experiments/roadmap-h; each script compares with its committed
          # output and prints '# matches'), the reviews' own checks (experiments/referee_z7, z8, z9) and rank0_ct.py
          # for (609,200), (809,409) (about 7 minutes)
          cd "$GITHUB_WORKSPACE"
          hm() { (cd "$1" && shift && python3 "$@" 2>/dev/null | grep -v 'PARI stack' > /tmp/hm.out && ! grep -q 'DIFFERS' /tmp/hm.out && tail -1 /tmp/hm.out | grep -q '^# matches'); }
          H=experiments/roadmap-h
          hm $H/h1 h1_pairs.py --negative; hm $H/h1 h1_scan.py --negative; hm $H/h1 h1_rank0_exact.py --negative
          hm $H/h1 h1_iso.py; hm $H/h1 h1_iso.py --negative
          hm $H/h2 h2_summary.py; hm $H/h2 h2_control.py; hm $H/h2 h2_control.py --negative
          hm $H/h3 h3_tables.py; hm $H/h3 h3_tables.py --negative; hm $H/h3 h3_tables.py --check 2000
          hm $H/h3 h3_weil.py --negative; hm $H/h3 h3_sizes.py
          hm $H/h4 h4_split.py --negative
          hm $H/h6 h6_split.py 627 364; hm $H/h6 h6_ranks.py --negative; hm $H/h6 h6_richelot.py --negative; hm $H/h6 h6_richelot.py --controls
          hm $H/h7 h7_g4k_rank1.py; hm $H/h7 h7_g4k_rank1.py --negative; hm $H/h7 h7_e04_rank.py; hm $H/h7 h7_e04_rank.py --negative
          (cd $H/h7 && python3 h7_g4k_rank1.py 13348,3795 13899,1180 2>/dev/null | grep -v 'PARI stack' | diff - h7_b13000_rank1.txt)
          hm scripts/second_descent rank0_ct.py; hm scripts/second_descent rank0_ct.py --negative
          for x in referee_z7/my2desc referee_z7/ct_mine referee_z7/velu_check referee_z7/partner_cells referee_z7/run_ct_g4k \
                   referee_z7/ct_rank0 referee_z7/classes referee_z8/my_local referee_z8/brute_p2 referee_z8/methA_above \
                   referee_z8/p3mod4 referee_z8/p3_methA referee_z8/h3_counts referee_z8/badprimes_left referee_z8/octic_cut \
                   referee_z8/octic_cut_all referee_z8/witness2 referee_z8/witness5 referee_z8/witness_odd referee_z8/witness_supp \
                   referee_z9/recount referee_z9/degcount referee_z9/h6_ident referee_z9/c5 referee_z9/g3_family_z9 referee_z9/sample_h2; do
            (cd experiments/$(dirname $x) && python3 -I $(basename $x).py 2>/dev/null | grep -v 'PARI stack' | diff - $(basename $x).txt)
          done
          # run 9 (tier D): experiments/conductor-t10 (the pair curves' Cassels-Tate pairing against the good-prime
          # removals) and review z11's checks (about 5 minutes)
          cd "$GITHUB_WORKSPACE/experiments/conductor-t10"
          python3 -I t10_pairct.py --negative 2>/dev/null | grep -v 'PARI stack' | diff - t10_negative.txt
          python3 -I t10_pairct.py --h1control 2>/dev/null | grep -v 'PARI stack' | diff - t10_h1control.txt
          python3 -I t10_pairct.py --summarize t10_997_a.txt,t10_997_b.txt,t10_15000_s100_a.txt,t10_15000_s100_b.txt 2>/dev/null | grep -v 'PARI stack' | diff - t10_summary.txt
          cd "$GITHUB_WORKSPACE/experiments/referee_z11"
          for s in rank0 recount wash_check pmat h1_mine forge_t10 z11_compare z11_pair forge_mine; do
            # stderr is kept and shown on failure: h1_mine.py stopped after 4 lines on GitHub's runner at f0d7edc (run 9), not here
            # a limit of 20 minutes per script (each takes seconds to minutes elsewhere); on SIGINT Python prints where it was
            timeout -s INT 1200 python3 -I -X faulthandler $s.py 2>/tmp/z11_$s.err | grep -v 'PARI stack' | diff - $s.txt || { echo "== $s: stderr"; tail -60 /tmp/z11_$s.err; exit 1; }
          done
          python3 -I z11_compare.py --set mid 2>/dev/null | grep -v 'PARI stack' | diff - z11_compare_mid.txt
          # run 10 (tier D): experiments/research-pairing, a closed formula for the pairing on E_08 and E_LU, rerun on the
          # pilot's kill lines (no -I: the scripts import each other from their own folder; they read the t10 files here)
          cd "$GITHUB_WORKSPACE/experiments/conductor-t10"
          for w in 08 LU; do
            python3 ../research-pairing/check_local.py $w 2>/dev/null | grep -v 'PARI stack' | diff - ../research-pairing/check_local_$w.txt
          done
          # review z12's checks (about a minute): its counts, the class formula, its own local terms, the b_r = 1 formula,
          # the report's counts, and the full test rerun from scratch on 6 curves against the committed records
          cd "$GITHUB_WORKSPACE/experiments/referee_z12"
          for s in analyse classcheck zlocal brone claims rerun_compare; do
            python3 -I $s.py 2>/dev/null | grep -v 'PARI stack' | diff - $s.txt
          done
          cd "$GITHUB_WORKSPACE"
          # no program of this job may rewrite a committed file (OUTPUTS.md)
          git diff --exit-code

  research:
    # Run 11 (tiers C and D, not counted): a separate AI research session's pairing notes and explorations with their
    # reviews (experiments/research-pairing/note2, explore3-5; referee_z13 to z16), the genus-3 quotient (genus3), Fisher's
    # pairings on I5's curves (conductor-t11), the (627,364) search over Q(i) (conductor-t13) and roadmap I with review
    # z17 (roadmap-i, referee_z17). A job of its own so that descents stays under its time limit. About 30 minutes.
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[full ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: pairing notes and reviews, genus 3, Fisher's pairings on I5's curves, (627,364) over Q(i), roadmap I
        shell: bash
        run: |
          set -e -o pipefail
          pip install -q -r scripts/g1_full/requirements.txt
          pip install -q sympy==1.14.0
          W="$GITHUB_WORKSPACE"
          # d DIR EXPECTED ARGS...: runs python3 ARGS in DIR, compares stdout (PARI's stack notice removed) with EXPECTED, shows stderr on failure
          d() { local dir="$1" out="$2"; shift 2; (cd "$W/$dir" && python3 "$@" 2>/tmp/d.err | grep -v 'PARI stack' | diff - "$out") || { echo "== $dir: $*"; tail -40 /tmp/d.err; exit 1; }; }
          # scripts that print '# matches' or '# DIFFERS' and exit 0 either way
          hm() { (cd "$W/$1" && shift && python3 "$@" 2>/dev/null | grep -v 'PARI stack' > /tmp/hm.out && ! grep -q 'DIFFERS' /tmp/hm.out && tail -1 /tmp/hm.out | grep -q '^# matches') || { echo "== hm $*"; tail -20 /tmp/hm.out; exit 1; }; }
          # the second pairing note (revision 2's scripts; they import parse.py, ct08.py of the first note)
          N=../research-pairing/note2
          export PYTHONPATH=$W/experiments/research-pairing/note2:$W/experiments/research-pairing
          for s in closed_formula isogeny_part shape radical; do d experiments/referee_z12 $N/$s.txt $N/$s.py; done
          for s in two two2; do d experiments/conductor-t10 $N/$s.txt $N/$s.py; done
          unset PYTHONPATH
          # review z13 (the second note; revision 3's H2 table)
          for s in gen_jobs:jobs claims_z13:claims_z13 analyse_z13:analyse_z13 rerun_z13:rerun_z13 h2_rerun_z13:h2_rerun_z13; do d experiments/referee_z13 ${s#*:}.txt -I ${s%%:*}.py; done
          # review z14 (explorations 3 and 5: the mixed curves, the Redei form, Theorem B)
          for s in ratios symbolic section_z14 mix_analyse; do d experiments/referee_z14 $s.txt -I $s.py; done
          # review z16 (exploration 5: the centre form in the bad-prime test, the ghost laws)
          for s in z16_witness z16_laws z16_summary z16_ghost; do d experiments/referee_z16 $s.txt -I $s.py; done
          # the genus-3 quotient y^2 = F0 F8 L U and the corner K-curve of (627,364) (build agent t12)
          G=experiments/genus3
          d $G genus3_split.txt -I genus3_split.py
          d $G genus3_points.txt -I genus3_points.py; d $G genus3_points_negative.txt -I genus3_points.py --negative
          d $G genus3_isog_627_364.txt -I genus3_isog.py
          d $G genus3_mult.txt -I genus3_mult.py
          d $G kcurve_exact.txt -I kcurve_exact.py; d $G kcurve_exact_negative.txt -I kcurve_exact.py --negative
          d $G genus3_rank_upper.txt -I genus3_rank_upper.py
          for s in verify_swap_and_genus3 genus3_ranks kcurve_not_qcurve; do d $G/session $s.txt -I $s.py; done
          d $G/session isogeny_classes_627_364.txt -I isogeny_classes.py
          # Fisher's pairings on the nine curves of I5 (build agent t11; each prints '# matches')
          for c in "E1(10512,145)-" "Sig+(22057,2351)" "E1(4440,2231)" "E1(8249,3720)" "E1(3540,2581)" "D1(12007,1799)" "E1(6480,4961)" "Sig+(12204,9853)" "E1(10512,145)+"; do
            hm experiments/conductor-t11 -I t11_theta.py "$c"
          done
          hm experiments/conductor-t11 -I t11_theta.py --negative
          # (627,364): the 2-coverings over Z[i] and the torsion searches (build agent t13)
          T=experiments/conductor-t13
          d $T covers.txt covers.py
          d $T search_E_H2000_torsion.txt search.py --curve=E --H=2000 --classes=torsion
          d $T search_E3_H2000_torsion.txt search.py --curve=E3 --H=2000 --classes=torsion
          d $T search_E3_alt_H2000_torsion.txt search.py --models=altmodels.json --curve=E3 --H=2000 --classes=torsion --skipbase
          d $T search_E_alt_H2000_torsion.txt search.py --models=altmodels.json --curve=E --H=2000 --classes=torsion --skipbase
          d $T certify.txt certify.py search_E_H50000_coset.json search_E3_H50000_coset.json search_E3_H100000_from50000_cosetA.json search_E3_H100000_from50000_cosetB.json search_E_alt_H10000_coset.json search_E3_alt_H10000_coset.json search_E_H2000_torsion.json search_E3_H2000_torsion.json search_E_alt_H2000_torsion.json search_E3_alt_H2000_torsion.json
          # roadmap I (a separate long-running AI session) and review z17
          R=experiments/roadmap-i
          hm $R/i1 i1_laws.py; hm $R/i1 i1_laws.py --negative; hm $R/i1 i1_negative.py
          hm $R/i2 i2_residual.py --negative
          hm $R/i3 i3_scan.py --negative
          hm $R/i4 i4_exchange.py --negative
          hm $R/i5 i5_rank.py --negative
          hm $R/i8 i8_pairct.py --negative; hm $R/i8 i8_pairct.py --compare50
          for s in z17_i8count z17_i8compare z17_i2check; do hm experiments/referee_z17 -I $s.py; done
          for p in a b c e; do hm experiments/referee_z17 -I z17_neither.py $p; done
          # review z15 (exploration 4: the 937 ratios, the ghost shape, cosets, tier A)
          for s in z15_shapes z15_shapes2 z15_shapes3 z15_partners z15_tierA z15_compare z15_ghostsample z15_rankbound z15_residual_all; do d experiments/referee_z15 $s.txt -I $s.py; done
          cd "$W"
          # no program of this job may rewrite a committed file
          git diff --exit-code

  last-pair:
    # LAST_PAIR.md: the argument for (627,364) and (991,263). An experiment, not counted in the census. This job reruns every
    # computation of it: the generator, the constants of the height bound, both sieves, the fibre, and the planted control.
    # Magma is not run; its answers are in magma_last_pair_raw.txt.
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[full ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: generator, constants, sieves to 596,309 and to 59,631,000, fibre, planted control
        shell: bash
        run: |
          set -e -o pipefail
          pip install -q -r scripts/g1_full/requirements.txt numpy==2.5.5
          cd scripts/second_descent
          f() { grep -v "PARI stack" || true; }
          python3 saturation.py 627,364 521266 | f | diff - saturation_627_364.txt
          python3 closure_estimate.py 627,364 521266 59630999 | f | diff - closure_estimate_627_364.txt
          python3 fibre.py 627,364 521266 | f | diff - fibre_627_364.txt
          (for r in 2,1 3,2 10,3 4,1 4,3 5,2; do python3 planted_control.py $r 30; done) | f | diff - planted_control.txt
          python3 mw_sieve.py 627,364 521266 1000000 10009 20089 30013 40009 | f | diff - mw_sieve_627_364.txt
          python3 mw_sieve_big.py 627,364 521266 100 10009 20089 30013 40009 50021 60013 | f | diff - mw_sieve_big_627_364.txt
          # the whole route on (440,279), closed by an L-value on another curve, and the sieve on (99,20)
          python3 saturation.py 440,279 231518 | f | diff - saturation_440_279.txt
          python3 closure_estimate.py 440,279 231518 30000 | f | diff - closure_estimate_440_279.txt
          python3 fibre.py 440,279 231518 | f | diff - fibre_440_279.txt
          python3 mw_sieve.py 440,279 231518 1000000 10009 20089 30013 40009 | f | diff - mw_sieve_440_279.txt
          python3 mw_sieve.py 99,20 18802 1000000 10009 20089 30013 40009 | f | diff - mw_sieve_99_20.txt
          # the whole route on the 24 ratios of square type with E1 of rank exactly 1
          python3 route_all.py 4 | diff - route_all.txt
          # the same on the ratios of square type left with 1000 < m <= 3000 whose E1 has rank exactly 1
          python3 two_map_scope.py pairs_wide_open.txt | f | diff - two_map_scope_wide.txt
          python3 two_map_scope.py pairs123.txt | f | diff - two_map_scope.txt
          # the exact route on three ratios closed by other means (LAST_PAIR.md, section 18; OUTPUTS.md); the models are the minimal models
          # (PARI's ellminimalmodel; for (440,279) the model of saturation_440_279.txt). The program prints each line as it goes and then all of them again, so the repeat is removed;
          # for (440,279) and (420,341) it exits with 1 on purpose (the analogue of Theorem A fails there), and the diff decides.
          (python3 exact_last_pair_route.py 187,84 55826 model=0,-1,0,4801746619611299721114526655,163620228695308602818059322473823297577025 || true
           python3 exact_last_pair_route.py 440,279 231518 model=0,-1,0,234855998575724119950174256951679,494588188707432659580713964254497581771145395745 || true
           python3 exact_last_pair_route.py 420,341 120238 model=0,1,0,101547849759331103572441792455359,29444456147762872577981199189928064917272903359 || true) | awk '!seen[$0]++' | diff - exact_last_pair_route.txt
          python3 route_all.py 4 two_map_scope_wide.txt | diff - route_wide.txt
          python3 route_all.py 4 two_map_scope_wide_twist.txt | diff - route_twist.txt
          # the cover descent on the 157 ratios of the census list
          (cd ../cover_descent && python3 cover_batch.py ../gauss_descent/pairs34.txt 4 | diff - cover_34.txt && python3 cover_batch.py ../second_descent/pairs123.txt 4 | diff - cover_123.txt)
          (cd ../cover_descent && for r in 820_799 889_320; do python3 cover_certificate.py $(echo $r | tr _ ,) | diff - cover_certificate_$r.txt && grep -q "^left by the descent: \[\]; left by the exhaustion: \[\];" cover_certificate_$r.txt || exit 1; done)
          test "$(grep -c "no class is possible" ../cover_descent/cover_34.txt)" = 34
          test "$(grep -c "generator: True; .*within the bound: \[(1, 1)\]; range covers the bound: True; fibre over a = 1 or b = 1: rational t = -1, 1$" route_wide.txt)" = 12
          test "$(grep -c "generator: True; .*within the bound: \[(1, 1)\]; range covers the bound: True; fibre over a = 1 or b = 1: rational t = -1, 1$" route_all.txt)" = 24
          grep -q "^left: \[(1, 1)\]$" mw_sieve_627_364.txt
          test "$(cat mw_sieve_627_364.txt mw_sieve_big_627_364.txt | grep -c "^test of the lifting: .* all of them returned: True; returned beyond them and the pairs left[a-z ]*: \[\]$")" = 2
          grep -q "^left: \[(1, 1)\]$" mw_sieve_big_627_364.txt
          test "$(grep -c "the planted pair (2, 1) survives; survivors: \[(0, 1), (2, 1)\]" planted_control.txt)" = 3
          test "$(grep -c "14 of 14" planted_control.txt)" = 6
          # no program of this job may rewrite a committed file (OUTPUTS.md)
          git diff --exit-code

  twist-search:
    # scripts/search/twist_search.txt: no t0 = p/q != 1 with m, p, q <= 400 at which all four points are rational on a twist.
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[full ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: twist_find to 400
        shell: bash
        run: |
          set -e
          gcc -O2 -Wall -Wextra -Werror -o /tmp/twist_find scripts/search/twist_find.c -lm
          /tmp/twist_find 400 400 2 200 > /tmp/tw1.out &
          P1=$!
          /tmp/twist_find 400 400 201 283 > /tmp/tw2.out &
          P2=$!
          /tmp/twist_find 400 400 284 346 > /tmp/tw3.out &
          P3=$!
          /tmp/twist_find 400 400 347 400 > /tmp/tw4.out &
          P4=$!
          wait $P1; wait $P2; wait $P3; wait $P4
          test ! -s /tmp/tw1.out
          test ! -s /tmp/tw2.out
          test ! -s /tmp/tw3.out
          test ! -s /tmp/tw4.out
          grep -qx 'twist_find 400 400: 0 solutions' scripts/search/twist_search.txt

  square-section:
    # SQUARE_SECTION.md: the second descent on the coverings of the class 2 at the 108 square-type curves m <= 300 (an
    # experiment, tier C for the listed curves, not counted). About 5 minutes. Run without --controls: the count of
    # control C2 depends on the points PARI's ellrank returns, so the output is compared up to the line "Part 2: ...",
    # the table in full; the hints of square_section_hints.json are checked exactly by the program (no PARI here).
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[full ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: square_section.py --mmax 300 against square_section.txt and square_section.tsv
        shell: bash
        run: |
          set -e -o pipefail
          pip install -q sympy==1.14.0
          T=$(mktemp -d)
          python3 scripts/g1_full/square_section.py --mmax 300 --bound 60 --tsv-to "$T/sq300.tsv" > "$T/sq300.txt"
          diff "$T/sq300.txt" <(head -n 140 scripts/g1_full/square_section.txt)
          diff "$T/sq300.tsv" scripts/g1_full/square_section.tsv
          test "$(grep -c '^Part 2: alpha(E(Q)) = K proved on 21 curves; rank exactly 1 on 6: ' "$T/sq300.txt")" = 1
          rm -rf "$T"
          # no program of this job may rewrite a committed file (OUTPUTS.md)
          git diff --exit-code

  scan-15000:
    # COMPLETE.md, section 7, test 7 (review of 7b4ff7a): the criterion by linear algebra on every coprime ratio with
    # 5000 < m <= 15000, and the four-class descent on every ratio of that range that is not of the two degenerate types
    # and keeps a class.
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[full ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: criterion and four-class descent, 5000 < m <= 15000
        shell: bash
        run: |
          set -e -o pipefail
          pip install -q sympy==1.14.0 cypari2==2.2.9
          cd scripts/cover_descent/structure
          test "$(python3 class_selmer_linalg.py 5010 5010 --from 5000 | grep -c '[1-9][0-9]* ratios, 0 different')" = 1   # a comparison with class_selmer.py that is not empty
          # COMPLETE.md, section 7, test 7, cross-check (a) in full: 5000 < m <= 5100 and 14900 < m <= 15000 (OUTPUTS.md; about a minute)
          (python3 class_selmer_linalg.py 5100 5100 --from 5000; python3 class_selmer_linalg.py 15000 15000 --from 14900) | diff - xcheck_15000.txt
          python3 class_selmer_linalg.py 10000 0 --from 5000 --list /tmp/a.txt > /tmp/sa.txt &
          python3 class_selmer_linalg.py 15000 0 --from 10000 --list /tmp/b.txt > /tmp/sb.txt &
          wait
          cat /tmp/sa.txt /tmp/sb.txt | diff - class_selmer_linalg_15000.txt
          cat /tmp/a.txt /tmp/b.txt | diff - class_selmer_15000_list.txt
          cd ..
          python3 tuple_descent.py batch magic structure/class_selmer_15000_list.txt 4 | diff - tuple_selmer_15000.txt
          test "$(grep -c 'nothing is left$' tuple_selmer_15000.txt)" = "$(wc -l < structure/class_selmer_15000_list.txt)"
          # no program of this job may rewrite a committed file (OUTPUTS.md)
          git diff --exit-code

  scan-5000:
    # LAST_PAIR.md, section 12: the four-class descent on EVERY ratio with m <= 5000 that avoids the 484 classes, rerun in
    # full (18,900 + 1,523 ratios) and compared with the committed files; and the rational-distance scan to denominator 300.
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[full ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: tuple descent to 5000, in full; rational distance to 300
        shell: bash
        run: |
          set -e -o pipefail
          pip install -q sympy==1.14.0
          cd scripts/cover_descent
          python3 tuple_descent.py batch magic ../gauss_descent/scan_certificates.txt 4 | diff - tuple_scan_5000.txt
          python3 tuple_descent.py batch magic pairs_trivial_5000.txt 4 | diff - tuple_trivial_5000.txt
          cd ../rational_distance
          python3 rd.py scan 2 300 | diff - rd_scan_2_300.txt
          python3 rd.py scan 1 60 3 | diff - rd_scan_outside_60.txt
          python3 rd_exhaust.py 1,3 2,5 3,7 1,8 7,16 26,225 | diff - rd_exhaust.txt
          pip install -q numpy==2.5.5
          cd ../cover_descent/third
          python3 third_run.py @../../gauss_descent/pairs34.txt 150 | diff - third_34.txt
          python3 third_run.py @pairs_123.txt 150 | diff - third_123.txt
          cd ../structure
          python3 class_two.py | diff - class_two.txt
          # the checks for Theorem C (COMPLETE.md): exact p-adic classes; about three minutes
          python3 class_local.py | diff - class_local.txt
          # COMPLETE.md, section 7 (review of 0b34613): the table of Theorem C' in full (enumeration to 4400; about four
          # minutes) and the criterion on every coprime ratio with m <= 5000 and on the lists of LAST_PAIR.md, section 12
          python3 class_good.py | diff - class_good.txt
          git diff --exit-code class_good_table.txt
          pip install -q cypari2==2.2.9      # faster factoring for class_selmer.py; the output is the same with sympy
          python3 class_selmer.py --all 5000 | diff - class_selmer_all_5000.txt
          python3 class_selmer.py --lists | diff - class_selmer_lists.txt
          python3 class_selmer_linalg.py 5000 1000 | diff - class_selmer_linalg.txt
          # a sample of 40 of the 997 by exhaustion (tuple_bruteforce.py: no valuations, no code shared with tuple_descent.py)
          cd ..
          cat structure/tuple_bruteforce_997_sample.txt | xargs -P 4 -I{} sh -c 'echo "({}) $(python3 tuple_bruteforce.py magic {} 150 5000 | tail -1)"' | LC_ALL=C sort | diff - structure/tuple_bruteforce_997_sample_out.txt
          test "$(grep -c 'kept at every prime: 0: \[\]$' structure/tuple_bruteforce_997_sample_out.txt)" = 40
          # review of 7b4ff7a: the repaired Passes against the table in both directions at finite powers (three minutes),
          # and the four-class descent with the bad primes only (COMPLETE.md, section 7, test 6)
          python3 structure/passes_tight.py | diff - structure/passes_tight.txt
          grep -qx 'cases 23; classes outside the row that pass: 0; classes of the row that do not pass: 0' structure/passes_tight.txt
          python3 tuple_badprimes.py structure/class_selmer_997.txt | diff - tuple_badprimes_997.txt
          cd structure
          cd ../fourth
          python3 compare.py | sed 's/  \[[0-9]*s\]$//' | diff - compare_out.txt
          python3 attack.py | sed 's/ [0-9]*s$//' | diff - attack_out.txt
          python3 mut.py | diff - mut_out.txt
          python3 mut_hint.py | diff - mut_hint_out.txt
          cd ../../perfect_triangle
          python3 pt.py scan 1 200 0.867 | diff - pt_scan_200.txt
