  four-points:
    # The four-point argument (FOUR_POINTS.md) run as a program, not only checked through its records:
    # the model and the identities with m, n as indeterminates; every record of dm4.py regenerated with PARI and Sage
    # and compared with the committed one; Proposition 1 on actual rational points of quadratic twists.
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[full ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: dm4_identities.py, dm4.py on all 52 pairs, dm4_twist.py on 12 pairs, the Gaussian descent on the 157 ratios
        shell: bash
        run: |
          set -e -o pipefail
          pip install -q -r scripts/g1_full/requirements.txt
          cd scripts/g1_full
          (cd ../gauss_descent && python3 gauss_descent.py 820,799 889,320 4,3 72,65 | sed 's/  \[[0-9.]* s\]$//' | diff - ci_expected.txt && python3 gauss_descent.py --pmax=150 $(cat pairs_notrivial_1000.txt) | sed 's/  \[[0-9.]* s\]$//' | diff - gauss_descent_notrivial_1000.txt)
          (cd ../gauss_descent && python3 gd_check.py $(cat pairs34.txt) | diff - gd_check_34.txt && python3 gauss_descent.py --pmax=200 $(cat pairs157.txt) | sed 's/  \[[0-9.]* s\]$//' | diff - gauss_descent_157.txt) &
          GAUSS=$!
          python3 dm4_twist.py 72,65 137,7 425,168 593,257 920,129 740,539 828,173 840,83 923,757 15,8 21,20 41,1 3 400 > /tmp/dm4_twist.out &
          TWIST=$!
          python3 dm4_identities.py | tee /tmp/dm4_identities.out
          diff <(sed 's/ *\[[0-9]* s\]//' /tmp/dm4_identities.out) <(sed 's/ *\[[0-9]* s\]//' dm4_identities.txt)
          mkdir /tmp/fresh
          grep -v '#' dm4_pairs.txt | xargs -P 4 -I{} sh -c 'python3 dm4.py {} > /tmp/fresh/{}.jsonl'
          cat /tmp/fresh/*.jsonl > /tmp/dm4_fresh.jsonl
          test "$(wc -l < /tmp/dm4_fresh.jsonl)" = 52
          python3 check_evidence.py --dm4 /tmp/dm4_fresh.jsonl
          wait $GAUSS
          wait $TWIST
          diff <(sed 's/   \[[0-9]* s\]$//' /tmp/dm4_twist.out) dm4_twist.txt
          grep -q "^72 configurations on twists, 0 outside the bounds" /tmp/dm4_twist.out
      - name: dm_sigma.py and sigma_certify.py on the census ratios they close (G1_FULL_SYSTEM.md, the curves of F0*F8*GL)
        shell: bash
        run: |
          set -e -o pipefail
          cd scripts/g1_full
          python3 dm_sigma.py --effort=4 --magma=magma_sigma2_raw.txt,magma_sigma3_raw.txt 91,60 209,120 420,341 572,555 608,105 680,111 741,580 760,39 945,248 > /tmp/sigma_fresh.jsonl
          python3 dm_sigma.py --magma=magma_sigma2_raw.txt,magma_sigma3_raw.txt 72,65 920,129 > /tmp/sigma_fresh2.jsonl
          python3 check_sigma.py /tmp/sigma_fresh2.jsonl > /tmp/check_sigma2.txt
          grep -q '^OK$' /tmp/check_sigma2.txt
          python3 check_sigma.py /tmp/sigma_fresh.jsonl | tee /tmp/sigma_check.txt
          grep -q "^of the 24 ratios open in the census before 24 November 2026: 15 closed" /tmp/sigma_check.txt
          grep -q "^OK$" /tmp/sigma_check.txt
          python3 sigma_certify.py 91,60:E+ 91,60:E- 209,120:E- 420,341:E- 572,555:E- 608,105:E+ 680,111:E- 741,580:E+ 760,39:E+ 945,248:E+ 72,65:E+ 920,129:E+ | grep -v 'PARI stack' > /tmp/sigma_evidence.txt
          python3 sigma_exact.py --same-group /tmp/sigma_evidence.txt   # PARI may return -G or G + T: compared exactly up to those
          python3 sigma_twice.py | diff - sigma_twice.txt
      - name: committed outputs of G1_FULL_SYSTEM.md and UNIFORM_RANK.md that no step above regenerates (OUTPUTS.md)
        shell: bash
        run: |
          set -e -o pipefail
          cd scripts/g1_full
          python3 dm4_degenerate.py 4,3 15,8 21,20 72,65 425,168 920,129 | diff - <(tail -n +2 dm4_degenerate.txt)
          (python3 dm4_validate.py 3,2 2 7/3 11/5 101/17 1009/331 20011/7919; python3 dm4_validate.py 72,65 2 7/3 101/17 1009/331) | diff - dm4_validate.txt
          python3 height_certify.py | diff - height_certify.txt
          python3 sigma_generic.py --pari | grep -v "PARI stack" | diff - sigma_generic_pari.txt
          python3 rank_indep_control.py 30 | diff - rank_indep_control.txt
          python3 rank_indep_control.py --census | diff - rank_indep_control_census.txt
          pip install -q passagemath-eclib==10.8.14      # eclib is not in requirements.txt
          python3 eclib_check.py | diff - <(tail -n +3 eclib_check.txt)
          # no program of this job may rewrite a committed file
          git diff --exit-code

  descents:
    # GAUSS_DESCENT.md and SECOND_DESCENT.md are experiments, not counted in the census. This job reruns the second descent
    # (all 24 curves on the 123 ratios), its controls, and the tests of the first descent on real numbers.
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[full ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 240    # 150 until run 12: at c8b677a the job ran past 2 hours
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: second descent on 123 ratios, planted points, L-values, Magma transcripts; Lemma, local sets and labels on real points
        shell: bash
        run: |
          set -e -o pipefail
          # since run 12: every command is traced with the time (UTC), so that a cancelled run shows where it was (at c8b677a
          # the job ran silently until it was cancelled at its 150-minute limit; at f0d7edc it failed at h1_mine.py after 118 minutes)
          export PS4='+ [$(date -u +%T)] '
          set -x
          pip install -q -r scripts/g1_full/requirements.txt
          # OUTPUTS.md: the first descent restricted to subsets of the forms on the 34 ratios (about 10 minutes), in the background
          (cd scripts/gauss_descent && python3 subsets.py $(cat pairs34.txt) > /tmp/subsets_34.out) &
          SUB34=$!
