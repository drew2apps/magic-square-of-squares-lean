name: CI

# Two levels.  Every push to main runs `build` (Lean, the axiom audit, the generated files, the C searches) and `quick`
# (the checkers that read committed transcripts and a few small reruns): about 20 minutes, most of it Lean.
# The three long jobs (`four-points`, `descents`, `twist-search`, about 65 minutes) regenerate the main computed records
# and stated samples of the others.  They do not regenerate everything: SECOND_DESCENT.md, section 8, lists the committed
# outputs that no job reruns (the wide runs, the scan beyond 1100, the 681-ratio real-point run and others).
# They run on a pull request, on a tag, when the workflow is started by hand (Actions, CI, "Run workflow"), and on a push
# whose commit message contains [full ci].  A green mark on a push without [full ci] therefore says less than a green
# mark on a full run: the long jobs show as skipped.  A release is made only from a commit with a full green run.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generated Lean files match their generators
        shell: bash
        run: |
          set -e
          python3 -m py_compile scripts/g1_full/*.py scripts/search/*.py scripts/gauss_descent/*.py scripts/second_descent/*.py scripts/hill/*.py
          python3 scripts/g1_full/check_evidence.py
          python3 scripts/g1_full/check_evidence.py --negative > /tmp/negative.out
          grep -q '^negative tests: 520 altered records, all rejected' /tmp/negative.out
          test "$(cat MagicSquareOfSquares/*.lean | grep -c '^theorem \|^private theorem ')" = "$(cat scripts/declared_theorems.txt)"
          python3 scripts/g1_full/octic_check.py > /tmp/octic.out
          diff /tmp/octic.out <(tail -n +2 scripts/g1_full/octic_check.txt)
          python3 scripts/g1_full/height_sides.py > /tmp/height_sides.out
          diff /tmp/height_sides.out scripts/g1_full/height_sides.txt
          grep -q "$(sha256sum scripts/search/seven.c | cut -d' ' -f1)" scripts/search/seven_search.txt
          gcc -O2 -Wall -Wextra -Werror -o /tmp/seven scripts/search/seven.c -lm
          gcc -O2 -Wall -Wextra -Werror -o /tmp/seven_brute scripts/search/seven_brute.c
          /tmp/seven 1 100000 | tee /tmp/seven.out
          grep -q "7 squares=235 8 squares=0 9 squares=0; multiples of Bremner's square=235 other=0" /tmp/seven.out
          test "$(/tmp/seven_brute 430 | sort -u)" = "425 138600 41496 7"
          gcc -O2 -Wall -Wextra -Werror -o /tmp/ratio_pairs scripts/search/ratio_pairs.c -lm
          for H in 100 400; do grep -qxF "$(/tmp/ratio_pairs $H scripts/g1_full/modp_classes.txt)" scripts/search/ratio_pairs.txt; done
          grep -qxF "$(python3 scripts/search/ratio_pairs_brute.py 50 scripts/g1_full/modp_classes.txt)" scripts/search/ratio_pairs.txt
          gcc -O2 -Wall -Wextra -Werror -o /tmp/twist_find scripts/search/twist_find.c -lm
          test -z "$(/tmp/twist_find 80 80)"
          python3 scripts/g1_full/gen_lean.py
          python3 scripts/g1_full/gen_census1000.py
          python3 scripts/g1_full/gen_sizecheck.py
          git diff --exit-code
      - uses: leanprover/lean-action@v1
      - name: Axiom audit
        shell: bash
        run: |
          set -o pipefail
          lake env lean scripts/Audit.lean | tee audit.txt
          grep '^AUDIT OK:' audit.txt >> "$GITHUB_STEP_SUMMARY"
          diff <(grep '^AUDIT OK:' audit.txt) scripts/audit_line.txt
          diff <(sort audit.txt) <(sort scripts/audit_output.txt)
          echo "::notice title=Axiom audit::$(grep '^AUDIT OK:' audit.txt)"

  quick:
    # On every push: what can be checked in a few minutes.  The transcripts of Magma against the committed outputs, the
    # counts, and a small rerun of each program, compared with the first lines of the committed files.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: transcript checkers, counts, and a small rerun of each descent program
        shell: bash
        run: |
          set -e -o pipefail
          pip install -q -r scripts/g1_full/requirements.txt
          cd scripts/gauss_descent
          python3 gauss_descent.py 820,799 889,320 4,3 72,65 | sed 's/  \[[0-9.]* s\]$//' | diff - ci_expected.txt
          python3 twocover_check.py | diff - twocover_check.txt
          python3 twocover_check.py --bounded | diff - twocover_bounded.txt
          python3 subsets.py 4,3 15,8 | diff - <(head -n 2 subsets.txt)
          cd ../second_descent
          python3 magma_check.py | diff - magma_check.txt
          python3 tally.py second_123.jsonl lvalue_open.jsonl | diff - tally.txt
          python3 second_descent.py --summary second_123.jsonl | diff - second_summary.txt
          python3 wide.py --summary wide_1000_2000.jsonl | diff - wide_summary.txt
          python3 second_descent.py --all 15,8 21,20 23,7 | diff - <(head -n 3 second_123.jsonl)
          python3 lproof.py 1e7 second_123.jsonl | grep -v "PARI stack" | head -n 5 | diff - <(head -n 5 lproof.txt)
          # LAST_PAIR.md, the fast parts (the two sieves are in the job last-pair of the full run)
          python3 saturation.py 627,364 521266 | grep -v "PARI stack" | diff - saturation_627_364.txt
          python3 closure_estimate.py 627,364 521266 59630999 | grep -v "PARI stack" | diff - closure_estimate_627_364.txt
          python3 fibre.py 627,364 521266 | grep -v "PARI stack" | diff - fibre_627_364.txt
          (for r in 2,1 3,2 10,3 4,1 4,3 5,2; do python3 planted_control.py $r 30; done) | grep -v "PARI stack" | diff - planted_control.txt
          cd ../gauss_descent
          python3 subsets_summary.py | diff - subsets_summary.txt
          cd ../hill
          python3 hill_identity.py | diff - hill_identity.txt
          python3 hill_check.py | diff - hill_check.txt
          python3 ap_relaxed.py 250 | diff - ap_relaxed_250.txt
          gcc -O2 -Wall -Wextra -Werror -fopenmp -o /tmp/ap_exact ap_exact.c && /tmp/ap_exact 250 | diff - ap_exact_250.txt

  four-points:
    # The four-point argument (FOUR_POINTS.md) run as a program, not only checked through its records:
    # the model and the identities with m, n as indeterminates; every record of dm4.py regenerated with PARI and Sage
    # and compared with the committed one; Proposition 1 on actual rational points of quadratic twists.
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[full ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: dm4_identities.py, dm4.py on all 52 pairs, dm4_twist.py on 12 pairs, the Gaussian descent on the 157 ratios
        shell: bash
        run: |
          set -e -o pipefail
          pip install -q -r scripts/g1_full/requirements.txt
          cd scripts/g1_full
          (cd ../gauss_descent && python3 gauss_descent.py 820,799 889,320 4,3 72,65 | sed 's/  \[[0-9.]* s\]$//' | diff - ci_expected.txt && python3 gauss_descent.py --pmax=150 $(cat pairs_notrivial_1000.txt) | sed 's/  \[[0-9.]* s\]$//' | diff - gauss_descent_notrivial_1000.txt)
          (cd ../gauss_descent && python3 gd_check.py $(cat pairs34.txt) | diff - gd_check_34.txt && python3 gauss_descent.py --pmax=200 $(cat pairs157.txt) | sed 's/  \[[0-9.]* s\]$//' | diff - gauss_descent_157.txt) &
          GAUSS=$!
          python3 dm4_twist.py 72,65 137,7 425,168 593,257 920,129 740,539 828,173 840,83 923,757 15,8 21,20 41,1 3 400 > /tmp/dm4_twist.out &
          TWIST=$!
          python3 dm4_identities.py | tee /tmp/dm4_identities.out
          diff <(sed 's/ *\[[0-9]* s\]//' /tmp/dm4_identities.out) <(sed 's/ *\[[0-9]* s\]//' dm4_identities.txt)
          mkdir /tmp/fresh
          grep -v '#' dm4_pairs.txt | xargs -P 4 -I{} sh -c 'python3 dm4.py {} > /tmp/fresh/{}.jsonl'
          cat /tmp/fresh/*.jsonl > /tmp/dm4_fresh.jsonl
          test "$(wc -l < /tmp/dm4_fresh.jsonl)" = 52
          python3 check_evidence.py --dm4 /tmp/dm4_fresh.jsonl
          wait $GAUSS
          wait $TWIST
          diff <(sed 's/   \[[0-9]* s\]$//' /tmp/dm4_twist.out) dm4_twist.txt
          grep -q "^72 configurations on twists, 0 outside the bounds" /tmp/dm4_twist.out

  descents:
    # GAUSS_DESCENT.md and SECOND_DESCENT.md are experiments, not counted in the census. This job reruns the second descent
    # (all 24 curves on the 123 ratios), its controls, and the tests of the first descent on real numbers.
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[full ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: second descent on 123 ratios, planted points, L-values, Magma transcripts; Lemma, local sets and labels on real points
        shell: bash
        run: |
          set -e -o pipefail
          pip install -q -r scripts/g1_full/requirements.txt
          cd scripts/second_descent
          python3 second_descent.py --all $(cat pairs123.txt) | diff - second_123.jsonl
          python3 second_descent.py --summary second_123.jsonl | diff - second_summary.txt
          python3 second_control.py | diff - second_control.txt
          python3 degenerate_tuples.py pairs123.txt | diff - degenerate_tuples.txt
          (for k in 1 3 5 7; do python3 planted.py 30 60 $k | grep -v "^m:n"; done) | diff - planted.txt
          python3 magma_check.py | diff - magma_check.txt
          python3 kdescent_test.py 1 300 | diff - kdescent_test.txt
          python3 lproof.py 1e14 second_123.jsonl | grep -v "PARI stack" | diff - lproof.txt
          python3 lvalue_close.py 1e13 $(python3 -c "import json; print(' '.join('%d,%d' % tuple(json.loads(l)['pair']) for l in open('second_123.jsonl') if json.loads(l)['status'] == 'open'))") | grep '^{' | diff - lvalue_open.jsonl
          python3 tally.py second_123.jsonl lvalue_open.jsonl | diff - tally.txt
          python3 wide.py 1000 1020 ../g1_full/modp_classes.txt | diff - <(head -n 5 wide_1000_2000.jsonl)
          python3 wide.py --summary wide_1000_2000.jsonl | diff - wide_summary.txt
          cd ../gauss_descent
          python3 real_points.py 300 $(cat pairs157.txt) | diff - real_points_157.txt
          python3 local_points.py $(cat pairs157.txt) | diff - local_points_157.txt
          python3 hilbert_check.py 3000 | diff - hilbert_check.txt
          python3 subsets.py 4,3 15,8 59,56 820,799 889,320 | diff - subsets.txt
          python3 twocover_check.py | diff - twocover_check.txt
          python3 subsets.py $(python3 -c "import math; print(' '.join('%d,%d' % (m, n) for m in range(2, 10) for n in range(1, m) if math.gcd(m, n) == 1))") | diff - <(head -n 27 subsets_small.txt)
          python3 gd_control.py 1 100 | diff - gd_control.txt
          python3 scan.py 1000 1100 ../g1_full/modp_classes.txt /tmp/scan_list.txt | sed 's/  \[[0-9]* s\]$//' | diff - scan_1000_1100.txt
          diff /tmp/scan_list.txt <(awk -F'[, ]' '$1 <= 1100' scan_certificates.txt)
          python3 gd_check.py --pmax=100 $(cat pairs_scan_high.txt) | diff - gd_check_scan_high.txt
          cd ../hill
          gcc -O2 -Wall -Wextra -Werror -fopenmp -o /tmp/ap_exact ap_exact.c && /tmp/ap_exact 1000 | diff - ap_exact_1000.txt

  last-pair:
    # LAST_PAIR.md: the argument for (627,364) and (991,263). An experiment, not counted in the census. This job reruns every
    # computation of it: the generator, the constants of the height bound, both sieves, the fibre, and the planted control.
    # Magma is not run; its answers are in magma_last_pair_raw.txt.
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[full ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: generator, constants, sieves to 596,309 and to 59,631,000, fibre, planted control
        shell: bash
        run: |
          set -e -o pipefail
          pip install -q -r scripts/g1_full/requirements.txt numpy
          cd scripts/second_descent
          f() { grep -v "PARI stack" || true; }
          python3 saturation.py 627,364 521266 | f | diff - saturation_627_364.txt
          python3 closure_estimate.py 627,364 521266 59630999 | f | diff - closure_estimate_627_364.txt
          python3 fibre.py 627,364 521266 | f | diff - fibre_627_364.txt
          (for r in 2,1 3,2 10,3 4,1 4,3 5,2; do python3 planted_control.py $r 30; done) | f | diff - planted_control.txt
          python3 mw_sieve.py 627,364 521266 1000000 10009 20089 30013 40009 | f | diff - mw_sieve_627_364.txt
          python3 mw_sieve_big.py 627,364 521266 100 10009 20089 30013 40009 50021 60013 | f | diff - mw_sieve_big_627_364.txt
          # the whole route on (440,279), closed by an L-value on another curve, and the sieve on (99,20)
          python3 saturation.py 440,279 231518 | f | diff - saturation_440_279.txt
          python3 closure_estimate.py 440,279 231518 30000 | f | diff - closure_estimate_440_279.txt
          python3 fibre.py 440,279 231518 | f | diff - fibre_440_279.txt
          python3 mw_sieve.py 440,279 231518 1000000 10009 20089 30013 40009 | f | diff - mw_sieve_440_279.txt
          python3 mw_sieve.py 99,20 18802 1000000 10009 20089 30013 40009 | f | diff - mw_sieve_99_20.txt
          # the whole route on the 24 ratios of square type with E1 of rank exactly 1
          python3 route_all.py 4 | diff - route_all.txt
          test "$(grep -c "generator: True; .*within the bound: \[(1, 1)\]; range covers the bound: True; fibre over a = 1 or b = 1: rational t = -1, 1$" route_all.txt)" = 24
          grep -q "^left: \[(1, 1)\]$" mw_sieve_627_364.txt
          grep -q "^left: \[(1, 1)\]$" mw_sieve_big_627_364.txt
          test "$(grep -c "the planted pair (2, 1) survives; survivors: \[(0, 1), (2, 1)\]" planted_control.txt)" = 3
          test "$(grep -c "14 of 14" planted_control.txt)" = 6

  twist-search:
    # scripts/search/twist_search.txt: no t0 = p/q != 1 with m, p, q <= 400 at which all four points are rational on a twist.
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[full ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: twist_find to 400
        shell: bash
        run: |
          set -e
          gcc -O2 -Wall -Wextra -Werror -o /tmp/twist_find scripts/search/twist_find.c -lm
          /tmp/twist_find 400 400 2 200 > /tmp/tw1.out &
          P1=$!
          /tmp/twist_find 400 400 201 283 > /tmp/tw2.out &
          P2=$!
          /tmp/twist_find 400 400 284 346 > /tmp/tw3.out &
          P3=$!
          /tmp/twist_find 400 400 347 400 > /tmp/tw4.out &
          P4=$!
          wait $P1; wait $P2; wait $P3; wait $P4
          test ! -s /tmp/tw1.out && test ! -s /tmp/tw2.out && test ! -s /tmp/tw3.out && test ! -s /tmp/tw4.out
          grep -qx 'twist_find 400 400: 0 solutions' scripts/search/twist_search.txt
