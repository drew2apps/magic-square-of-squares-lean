          python3 rank_fisher5_local.py --negative 2>/dev/null | grep -v 'PARI stack' | grep -v '^rank_fisher5_local.py: local points' | diff - rank_fisher5_local_negative.txt
          # run 5 (experiments/, tier D): Demjanenko-Manin on y^2 = g4 K (exact; conditional on rank 1), its exact rank bounds,
          # the PARI cross-check, and the exact rank bounds for the seven conditional ratios (about 5 minutes)
          cd "$GITHUB_WORKSPACE"
          pip install -q sympy==1.14.0
          f5() { grep -v -e 'PARI stack' -e '^# matches'; }
          G=experiments/census-wide/g4k; K=experiments/census-wide/rank1
