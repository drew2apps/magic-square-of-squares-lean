          python3 lball.py curve 0,-491040,0,-13400146081,0 '(440,279), curve y^2 = x(x - 719^2)(x + 161^2), the twist by -1 of the Frey curve:' | grep -v "PARI stack" | diff - lball_440_279.txt
          python3 lvalue_close.py 1e13 $(python3 -c "import json; print(' '.join('%d,%d' % tuple(json.loads(l)['pair']) for l in open('second_123.jsonl') if json.loads(l)['status'] == 'open'))") | grep '^{' | diff - lvalue_open.jsonl
