# Sub-project: "rank E(Q) >= 2" for the twice-square curves, on top of Michael Stoll's
# EllipticCurves library (Mordell-Weil over number fields).  Own toolchain (v4.36.0) and Mathlib
# (the rev pinned by EllipticCurves 2164fb5); the main library stays on v4.33.1.
# The four main-library modules it needs are compiled from the main tree (srcDir = ".."),
# so there is one copy of each source file.
name = "lean_rank"
defaultTargets = ["MagicSquareOfSquares", "LeanRank"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.36.0"

[[require]]
name = "EllipticCurves"
git = "https://github.com/MichaelStollBayreuth/EllipticCurves"
rev = "2164fb57f067b75cd515029cddb2be50fd059983"

[[lean_lib]]
name = "MagicSquareOfSquares"
srcDir = ".."
roots = ["MagicSquareOfSquares.G1Sigma", "MagicSquareOfSquares.G1SigmaGeneric",
  "MagicSquareOfSquares.TwoDescentMap", "MagicSquareOfSquares.TwoDescentCertificates"]

[[lean_lib]]
name = "LeanRank"
globs = ["LeanRank.+"]
